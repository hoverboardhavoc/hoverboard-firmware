[package]
name = "store"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "Layer 1 flash key-value config store: log-structured, wear-aware, host-tested over a mock flash. base-only core (the on-target FmcFlash adapter is added in Pass 2)."

[dependencies]
base = { path = "../base" }

# The on-target FmcFlash adapter, over one of two HALs:
# - `hal` (motorcontroller/hal, specs/hal.md section 3.3), behind the `hal` feature: the per-chip
#   images enable it together with their chip feature (`firmware`'s `gd32f103c8`/`gd32f130c8`,
#   `store-test`'s three);
# - `runtime-hal` (the git dependency, shared/Cargo.toml) otherwise: the universal image, until it is
#   retired with runtime-hal after the bench parity gate (hal.md section 9, step 2). A plain
#   dependency rather than a feature, so the universal image's build of this crate is unchanged.
# Both are TARGET-GATED (thumbv7m only): the host `cargo test` build never links a HAL (it uses
# MockFlash), so the store core and field set stay base-only on the host.
[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
runtime-hal = { workspace = true }
hal = { path = "../../motorcontroller/hal", optional = true }

# HOST-TEST ONLY (no bytes in any image, and no runtime dependency: `store` does not depend on
# `control`, and must not -- the cascade is pure math with no notion of persistence). It is here so
# ONE test can assert the thing neither crate can state alone: the `CONTROL_GAIN_*` defaults ARE the
# gain constants the control crate compiles in, index for index, so a fresh board runs exactly what
# it ran before the gains became fields (`specs/remote-ui.md` section 4). Written in two places by
# necessity; pinned in one.
[dev-dependencies]
control = { path = "../../motorcontroller/control" }
# The IMU frame seam (IMU_AXIS_SIGN / IMU_GYRO_BIAS / IMU_AXIS_ROLE -> imu::Config::staged) is
# round-tripped through a store here, the drive-lean precedent: imu does not depend on store.
imu = { path = "../../motorcontroller/imu" }

[features]
# The adapter over `hal` instead of runtime-hal (see the dependency block above).
hal = ["dep:hal"]

# The reserved store-test fields (T_KEY/T_BLOB), their value consts, the scenario ids, and the
# `run`/`run_var` scenario dispatch. OFF by default so a production build's field set is exactly the
# genuine tunables. Enabled by the
# `store-test` firmware, the emulator-runner store scenarios, and the store's own host tests
# (`cargo test -p store --features test-fields`; CI passes `-F store/test-fields`).
test-fields = []

# The host-only name table (`NAMES`, `specs/cli-config.md` section 3): every field's path, index kind
# and display kind, for hoverboard-cli and the tools that take their names from it. OFF by default,
# so the firmware image carries no name. The store's own tests compile the table without it.
names = []

# The crafted-region dump tool for the silicon bench oracle (it uses `store::scenarios`, behind
# `test-fields`). `required-features` keeps a plain `cargo test -p store` from trying to compile it
# without the feature (it would fail on the gated scenario ids).
[[example]]
name = "craft_region"
required-features = ["test-fields"]
