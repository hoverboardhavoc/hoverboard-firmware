[package]
name = "dummy-test"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "The dummy firmware images (dummy-pass / dummy-fail / dummy-hang) that run the shared dummy() on a chip or emulator. Thumbv7m, cortex-m-rt. These are the exact images flashed and emulated."

[dependencies]
test-shared = { path = "../test-shared" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"

# The chip's flash vector table, from `hal` for the build's chip (specs/hal.md section 8.3: the Tier-2
# images run per chip). Target-gated: the host build degrades to an empty main.
[target.'cfg(target_arch = "arm")'.dependencies]
hal = { path = "../hal" }

# One per chip; none is the default, so the workspace sweep skips this crate (`default-members`)
# and every build names its chip, as tools/emulator-runner's dummy tests do.
[features]
gd32f103c8 = ["hal/gd32f103c8"]
gd32f130c8 = ["hal/gd32f130c8"]
gd32f103rc = ["hal/gd32f103rc"]
