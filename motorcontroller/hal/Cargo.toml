[package]
name = "hal"
version = "0.1.0"
license.workspace = true
edition = "2021"
# Not a native library: the key lets build.rs publish the chip's memory sizes to the build scripts of
# the images that depend on this crate (`DEP_HAL_FLASH_KIB` and the rest; firmware/build.rs sizes the
# per-chip linker regions from them).
links = "hal"
description = "The hoverboard HAL (specs/hal.md): one source for the GD32F103C8, GD32F130C8, GD32F103RC and MM32SPIN05, with the chip chosen at compile time by exactly one cargo feature. Each chip is a const descriptor plus one register model per peripheral; the image links the chip's flash vector table through cortex-m-rt's `device` feature. No detection, no RAM vector table."

[dependencies]
cortex-m = "0.7"
embedded-hal = "1.0"
embedded-io = "0.6"
# The bounded channel list `InjectedAdcConfig` and `AdcConfig` carry (the version the firmware
# already links, so the config the firmware builds is the type the HAL takes).
heapless = "0.8"

# The flash vector table: the HAL supplies `__INTERRUPTS` and `device.x` for the compiled chip
# (section 5 of specs/hal.md), which is what cortex-m-rt's `device` feature links. Board target only:
# the host build of this crate is its pure parts and their tests.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m-rt = { version = "0.7", features = ["device"] }

# One feature per chip; exactly one must be enabled (src/lib.rs refuses none or two) unless the
# build is the host's `pincap` tables alone. build.rs maps
# the chip to its register model per peripheral and to its vendor vector list.
[features]
gd32f103c8 = []
gd32f130c8 = []
gd32f103rc = []
mm32spin05 = []
# The pin capability tables of every chip (`src/pincap.rs`), for the host tools that check a board's
# stored configuration (`specs/config-read-once.md` section 4). No image enables it; on its own,
# with no chip feature, the crate is those tables and nothing else.
pincap = []
