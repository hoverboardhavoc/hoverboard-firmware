# IMU + attitude silicon-gate bench firmware (specs/imu.md "Silicon validation" +
# specs/silicon-queue.md section 2). Target: the bench F130 slave with the clone IMU (WHO_AM_I 0x2E)
# on hardware I2C0 PB6/PB7. The image probes the clone as CLONE_2E, applies the 5-write config
# sequence, reads the config registers back, then runs the 250 Hz burst-read loop feeding the Mahony
# attitude filter, with a gyro bias-cal capture fed back into the imu Config (the spec's feedback
# step). Everything observable over SWD via the IMU_BENCH_OBS block (offsets documented on the
# struct). Bench-only, not a production path.
#
# BUILD, one image per chip on the hal crate (specs/hal.md section 3.2). A chip feature is required,
# so the workspace sweep skips this crate (`default-members` in motorcontroller/Cargo.toml):
#   cargo build --release -p imu-bench --features "hardware gd32f130c8"   (or gd32f103c8)
#   -> motorcontroller/target/thumbv7m-none-eabi/release/imu-bench  (~10 KiB, fits the 64 KiB FLASH)
#
# Both bins are `required-features = ["hardware"]` (below), so a build without it SKIPS them: the
# Mahony/CORDIC math overflowed 64 KiB of `.text` at the dev opt-level 0, while the release image
# is ~10 KiB (full LTO crushes it) and the dev image never reaches hardware. There is NO oversized
# static (`.data == 0` both profiles). On a host target the bin degrades to an empty main (only
# when the feature is on), so it never links the HAL.
[package]
name = "imu-bench"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "Bench-only IMU + attitude silicon validator (thumbv7m, one image per chip on the hal crate): CLONE_2E probe/init/readback on I2C0 PB6/PB7, 250 Hz burst reads feeding Mahony, bias-cal capture + feedback, results in the SWD-readable IMU_BENCH_OBS block. Build release with --features \"hardware <chip>\" (see the header)."

[features]
# `hardware` gates the bench bins (below). OFF by default, so a dev build skips the images.
hardware = []
# One per chip (specs/hal.md section 3.2); none is the default, so the workspace sweep skips this
# crate (`default-members`).
gd32f103c8 = ["hal/gd32f103c8"]
gd32f130c8 = ["hal/gd32f130c8"]

# The bench image is built ONLY under `--features hardware`. `path` is the default auto-discovery
# location, restated because an explicit `[[bin]]` disables auto-discovery for this target.
[[bin]]
name = "imu-bench"
path = "src/bin/imu-bench.rs"
required-features = ["hardware"]

# The controlled ISR-load repro for the I2C master-receive race (the 2026-07-18 imu_live=0 root
# cause): back-to-back 14-byte bursts under an aggressive SysTick interrupt, to prove a receive
# path survives the race that wedged the Solution-A driver. Same feature gate as the main bench bin
# (release-only, bench-only).
[[bin]]
name = "imu-irqload"
path = "src/bin/imu-irqload.rs"
required-features = ["hardware"]

[dependencies]
# The device contract under test: probe / init / burst read / conditioning (specs/imu.md).
imu = { path = "../imu" }
# The consumer under test: Mahony filter fed per specs/attitude.md wiring (pitch/roll outputs).
attitude = { path = "../attitude" }
# The audited obs-field store macro (test_shared::obs_store!): the SWD-readable IMU_BENCH_OBS writes.
test-shared = { path = "../test-shared" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"

# The HAL for the compiled chip: the chip context, the clock tree, the pins, hardware I2C (I2c0 on
# PB6/PB7) and the flash vector table (linked through cortex-m-rt's `device` feature). Target-gated
# like the firmware's; the host build degrades to an empty main and never links the HAL. The
# SysTick delay is cortex-m's `delay::Delay`.
[target.'cfg(target_arch = "arm")'.dependencies]
hal = { path = "../hal" }
embedded-hal = "1.0"
