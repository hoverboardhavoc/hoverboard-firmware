[package]
name = "firmware"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "The firmware binary: one image per chip on the hal crate (`gd32f103c8`, `gd32f130c8` on thumbv7m: `cargo image-f103`, `cargo image-f130`; `mm32spin05` on thumbv6m, a CI-only size build: `cargo image-mm32`). Mounts the flash store at the top of flash and runs the service loop."

# The images this crate builds, one table per image, keyed by image name (specs/firmware-bundle.md
# section 3.3; the name's form is section 3.2's `<role>-<chip>`). `hoverboard-cli firmware pack`
# copies the name, kind and targets into the bundle manifest, and `hoverboard-cli board update`
# picks the image whose target equals the family and flash size the board's TARGET_ID reports. The
# image's guards are keyed by the same name in tools/image-guard-syms.sh. `features` are the cargo
# features that build the image; the packer checks the name's chip against them.
#
# The MM32SPIN05 build (`cargo image-mm32`) has no table and no guards: it is a CI-only size
# measurement, linked past its chip's flash (the `oversize-link` feature below), and no install path
# takes it (specs/firmware-bundle.md section 3.2).
[package.metadata.hoverboard-image.mainboard-gd32f103c8]
kind = "board"
features = ["gd32f103c8"]
targets = [{ family = "gd32f10x", flash_kib = 64 }]

[package.metadata.hoverboard-image.mainboard-gd32f130c8]
kind = "board"
features = ["gd32f130c8"]
targets = [{ family = "gd32f1x0", flash_kib = 64 }]

[dependencies]
# The libraries firmware assembles; it owns no behavior of its own. `base` is pulled in transitively
# by `store`; firmware names `store` (the flash KV store + FmcFlash) directly.
store = { path = "../../shared/store" }
# The packed pin type, the dead-time floor and the boot status record (specs/configured-links.md):
# each bring-up reads its own fields and records what did not come up in BOARD_OBS, which is
# served by `STATUS_READ`. HAL-free, no_std.
board = { path = "../board" }
# The SWD mailbox: the firmware carves its fixed RAM region (memory.x) and inits the header at boot,
# and services it from the loop (specs/swd-mailbox.md). HAL-free, no_std.
swd-mailbox = { path = "../../shared/swd-mailbox" }
# L3 (the `net` Responder, serviced over the mailbox L2 link) + L2 (the `Link`/`SerialTransport` the
# mailbox rides on). HAL-free, no_std.
net = { path = "../../shared/net" }
link = { path = "../../shared/link" }
# The integration stack (specs/integration.md, slice 7): the ISR-safe scheduler, the pure
# orchestrator core (which carries state/control/inputs/attitude-consumption internally), the
# link-control payload codec (the 0x10..0x2F hand-back routing + the cyclic TX build), and the
# IMU/attitude crates for the plan-gated bring-up + the attitude config seam. All HAL-free no_std.
scheduler = { path = "../scheduler" }
# The commutation math (specs/commutation.md): the period ISR steps its `Commutator` and lowers the
# `MotorOutput` to the two register writes. HAL-free, no_std, and the single owner of the ARR/duty
# scale the timer is brought up to.
commutation = { path = "../commutation" }
orchestrator = { path = "../orchestrator" }
# The control cascade, named directly for ONE thing: the live gain shadow (`specs/remote-ui.md`
# section 4). The boot seam builds it from the store's `CONTROL_GAIN_*` fields and the loop's tune
# lane writes it, and both of those sit in this crate, beside the store and the responder. The
# cascade itself stays the orchestrator's to drive. Already linked transitively; no new bytes.
control = { path = "../control" }
# The input lines' polarity mapping (`inputs::asserted`): the firmware samples the three pins and
# this is where the level code becomes assertions, against `store::BOARD_INPUT_POLARITY`. The
# crate is already linked through the orchestrator, which owns the debouncers it feeds; no new
# bytes, and naming it here keeps the mapping out of this file as three literals.
inputs = { path = "../inputs" }
linkctl = { path = "../../shared/linkctl" }
imu = { path = "../imu" }
attitude = { path = "../attitude" }
# The device-driver seam for the inter-board UART adapter (embedded-io over hal's SplitSerial and
# RingBufferedRx), which link's SerialTransport drives.
embedded-io = "0.6"
# `OutputPin` for the SELF_HOLD power-latch assertion at boot; matches hal's version.
embedded-hal = "1.0"
# The bounded Vec hal's InjectedAdcConfig carries (same version, so the channel list the motor
# bring-up builds IS the type the HAL consumes).
heapless = "0.8"
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"

# Host-test only (no bytes in the image). The `arm` tests mount a REAL `Store` over a small
# in-RAM `Flash` (`crate::test_flash`), and implementing `store::Flash` means naming `base::error::FlashError`, which
# `store` does not re-export (the `net` walk tests take the same path). `store` pulls `base` in
# transitively either way, so this adds no new crate to the graph.
[dev-dependencies]
base = { path = "../../shared/base" }
# The mode machine, for the one arm test that asserts the OFF gate itself opens after a shutdown
# taken at speed (`motorcontroller/firmware/src/arm.rs`). The claim is "the machine can leave OFF", so the
# test drives the REAL machine rather than restating its gate. Already in the graph through
# `orchestrator`, which does not re-export it; host-test only, no bytes in the image.
state = { path = "../state" }

# The HAL (motorcontroller/hal, specs/hal.md), with the chip the image's feature names. Target-gated:
# the host build of this crate degrades to an empty `main`, so it never links a HAL.
[target.'cfg(target_arch = "arm")'.dependencies]
hal = { path = "../hal", optional = true }

# Which chip this image is for: exactly one (src/main.rs refuses none or two on the target), with the
# store's FmcFlash on the same HAL.
[features]
gd32f103c8 = ["dep:hal", "hal/gd32f103c8", "store/hal"]
gd32f130c8 = ["dep:hal", "hal/gd32f130c8", "store/hal"]
mm32spin05 = ["dep:hal", "hal/mm32spin05", "store/hal"]
# Link into a measurement region larger than the chip's flash and SRAM (build.rs), so an image that
# does not fit still links and its size can be read. The ELF defines `__image_not_flashable`, which
# hoverboard-cli refuses on every install path and in the packer. `cargo image-mm32` alone sets it.
oversize-link = []
