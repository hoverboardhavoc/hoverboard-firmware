[build]
target = "thumbv7m-none-eabi"        # default target: bare-metal Cortex-M3

[target.thumbv7m-none-eabi]
# cortex-m-rt linker script; scoped so host tests are unaffected. `--icf=all` (shrink round 7,
# 2026-10-27, specs/decision-flash-budget.md) folds byte-identical functions at link time: -152 B
# of flashed span, every fold cold and enumerated there (the four 8 B panic stubs into one, the
# fourteen default exception handlers into one, memclr4/memclr8, memcpy4/memcpy8, two
# `copy_from_slice_impl::<u8>`). `safe` folds nothing here (0 B), because these functions are all
# address-taken. A fold only ever redirects a call to an identical body, so it changes no behaviour;
# what it CAN do is keep the cold twin of a hot function, so a round that touches the window re-runs
# the window symbol diff recorded with the round. `nm` keeps every folded name as an alias at the
# survivor's address, which is why the required-symbol and hot-window gates still resolve.
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=--icf=all"]

# Nothing built for the board runs on the machine that built it, so cargo is told to say that rather
# than hand an ARM ELF to the host loader. `cargo run -p firmware` used to die on an OS exec error
# that named neither the target nor the right command; it now refuses and names ./tools/host-test.sh,
# `cargo image-<chip>` and tools/flash.sh.
#
# What this does NOT cover, because cargo offers no hook before compilation: `cargo test -p <crate>`
# for a crate that HAS tests fails to compile, with a wall of `can't find crate for test` (libtest is
# not built for thumbv7m) and exit 101. That is loud but it names nothing; ./tools/host-test.sh is the
# route, and CI runs that same script. A crate with no test target at all (imu-bench, whose bins are
# behind `required-features`) still exits 0 having run nothing, which is true of it on the host too.
runner = "../tools/board-target-runner.sh"

# The MM32SPIN05's Cortex-M0 builds (specs/hal.md section 3.1): the hal crate and the validators on
# it with the `mm32spin05` feature, `--target thumbv6m-none-eabi`, and the mainboard firmware as a
# CI-only size build (`cargo image-mm32`, below). The same link script and folding as the thumbv7m
# images.
[target.thumbv6m-none-eabi]
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=--icf=all"]
runner = "../tools/board-target-runner.sh"

# The shipping images, one per chip (specs/hal.md section 6), here and in CI: `cargo image-f103`,
# `cargo image-f130` and `cargo image-f103rc`. `cargo image-mm32` is not one: see its own comment. Each is the release build of `firmware` with one chip feature, in its own
# target directory, so the two images never share (or overwrite) a build. The ELF is
# target/<chip>/thumbv7m-none-eabi/release/firmware; the image is named mainboard-<chip> in the
# firmware crate's `hoverboard-image` tables.
#
# Each rebuilds core + compiler_builtins from source under this workspace's release profile
# (rust-toolchain.toml explains why: -2,408 B of flashed span, and the profile pins in Cargo.toml
# explain why core must not be left at the base "z"). Because those are the ONLY builds whose bytes
# reach flash, the flag belongs to them alone.
#
# They are ALIASES and not a bare `[unstable] build-std = [...]` key: an unstable key here applies to
# EVERY cargo invocation in this workspace, so the host tests and the test-image builds the emulator
# runner makes here would all start rebuilding std, paying minutes per run to change nothing about
# the image. `--target` is spelled out even though [build] target already selects it: build-std
# wants the target explicit. CI runs these same aliases, so the local image and the CI image come out
# of the same invocation.
[alias]
image-f103 = ["build", "--release", "-p", "firmware", "--features", "gd32f103c8", "--target", "thumbv7m-none-eabi", "--target-dir", "target/gd32f103c8", "-Z", "build-std=core,compiler_builtins"]
image-f130 = ["build", "--release", "-p", "firmware", "--features", "gd32f130c8", "--target", "thumbv7m-none-eabi", "--target-dir", "target/gd32f130c8", "-Z", "build-std=core,compiler_builtins"]
# The 12-FET's GD32F103RC image (specs/twelve-fet.md section 3.1), two motors.
image-f103rc = ["build", "--release", "-p", "firmware", "--features", "gd32f103rc", "--target", "thumbv7m-none-eabi", "--target-dir", "target/gd32f103rc", "-Z", "build-std=core,compiler_builtins"]
# The MM32SPIN05 mainboard firmware, the full feature set, which does not fit the chip's 32 KiB
# (specs/hal.md section 9, step 3). `oversize-link` links it into a larger measurement region so CI
# can read its size, and marks the ELF never-flashable (motorcontroller/firmware/not-flashable.x):
# every hoverboard-cli install path and the bundle packer refuse it. It is not in the bundle.
image-mm32 = ["build", "--release", "-p", "firmware", "--features", "mm32spin05,oversize-link", "--target", "thumbv6m-none-eabi", "--target-dir", "target/mm32spin05", "-Z", "build-std=core,compiler_builtins"]
