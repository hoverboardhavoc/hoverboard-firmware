# esp-hal 1.2, esp-radio 1.0.0-beta.1 and esp-rtos 0.4 need Rust 1.95 or later.
# It is NOT the motorcontroller workspace's pinned nightly: nothing here uses build-std, and the shared crates
# this firmware links (link, net, store, base, swd-mailbox) build on stable.
[toolchain]
channel = "1.96.0"
components = ["rust-src", "rustfmt", "clippy"]
targets = ["riscv32imc-unknown-none-elf"]
