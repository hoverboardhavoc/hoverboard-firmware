name: CI

# Layer 1 (storage) CI. From Layer 0 the `base` crate was HAL-independent, but Layer 1 adds the
# `store` / `store-test` crates whose on-target `FmcFlash` adapter depends on the sibling runtime-hal
# (a target-gated path dep `../../../runtime-hal`). Cargo loads a path dependency's manifest during
# workspace resolution REGARDLESS of the build target, so EVERY job that runs cargo over the workspace
# (build, host-tests, emulator-tests) must check runtime-hal out as a sibling of the repo, even the
# host-target test job where the HAL is not actually linked. So each cargo job checks the two repos out
# into sibling subdirectories and runs from the firmware one. runtime-hal is a public repo; we pin its
# default branch (main).
#
# Six checks:
#   - lint: rustfmt over everything CI builds, then clippy over BOTH build surfaces (thumbv7m and
#     host --all-targets; without --all-targets clippy lints only the lib and skips every test),
#   - build the default embedded target (thumbv7m-none-eabi),
#   - run the host tests on the runner's Linux host target,
#   - run the workspace-excluded swd-bridge's tests (the HostMailbox <-> Mailbox agreement suite),
#   - run the Tier-2 Unicorn emulator tests (the dummy + store images), plus clippy over the
#     emulator-runner (it lives in that job because its unicorn build needs cmake),
#   - run the Kotlin protocol mirror's drift gate, the one job with no Rust toolchain in it: it
#     reads the Rust as text and compares it to protocol-kotlin's mirror of the wire protocol.
#
# TOOLCHAIN: every CARGO job runs the PINNED NIGHTLY nightly-2026-07-20, not stable (rust-toolchain.toml
# carries the why: the shipping image is built with -Z build-std, worth -2,408 B of flashed span, and
# build-std is nightly-only). Three consequences this file has to honour, in every one of them:
#   - `dtolnay/rust-toolchain@<ref>` takes the toolchain from its REF, and that argument OVERRIDES
#     rust-toolchain.toml. A job left on `@1.96.0` would silently keep building on stable while the
#     repo believes it is on nightly, so all five jobs use `@master` with an explicit `toolchain:`
#     input, which is the action's documented form for a dated nightly. The action ref floats; the
#     TOOLCHAIN is pinned by the input, and rust-toolchain.toml is the backstop (cargo resolves it at
#     invocation regardless of what the action made default).
#   - the SAME component set (rustfmt, clippy, rust-src) is passed in EVERY job, even where a job uses
#     only part of it. rustup installs any component named in rust-toolchain.toml even into an
#     already-present toolchain, so a job that requested a smaller set would trigger a full toolchain
#     re-download on its first cargo call. Matching the file exactly is the cheap way to satisfy it.
#   - the toolchain file also auto-installs thumbv7m-none-eabi; we still pass `targets` so the host
#     target the tests need is present too.

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fixed host target so host tests do not inherit the .cargo/config.toml default
  # (thumbv7m-none-eabi). GitHub Linux runners are x86_64.
  HOST_TARGET: x86_64-unknown-linux-gnu

jobs:
  # Format + lint gates, first so an unformatted commit fails fast (rustfmt is a pure-source check,
  # no build). Clippy runs over BOTH surfaces CI builds:
  #   - the thumbv7m surface (what `cargo build` ships). It cannot use --all-targets: test harnesses
  #     need std/libtest, which the bare-metal target lacks;
  #   - the host-test surface with --all-targets, which is where the #[cfg(test)] modules and
  #     integration tests get linted (clippy without --all-targets lints only the lib and silently
  #     skips all test code), with the same -F store/test-fields the host-test job compiles with.
  # The workspace-excluded crates are covered too: swd-bridge is fmt-checked and
  # clippy'd here via its manifest; emulator-runner is fmt-checked here but clippy'd in the
  # emulator-tests job (its unicorn native build needs cmake, installed there); hardware-runner
  # is fmt-checked here and ONLY fmt-checked (it drives real probes over probe-rs, so nothing in
  # CI compiles or runs it; rustfmt is a pure-source check, no build needed).
  lint:
    name: rustfmt + clippy (thumbv7m + host --all-targets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoverboard-firmware
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          path: hoverboard-firmware

      - name: Checkout runtime-hal (sibling, main)
        uses: actions/checkout@v4
        with:
          repository: hoverboardhavoc/runtime-hal
          ref: main
          path: runtime-hal

      - name: Install Rust (pinned nightly) + targets + rustfmt/clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          targets: thumbv7m-none-eabi, x86_64-unknown-linux-gnu
          components: rustfmt, clippy, rust-src

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hoverboard-firmware

      - name: rustfmt (workspace)
        run: cargo fmt --all --check

      - name: rustfmt (workspace-excluded crates)
        run: |
          cargo fmt --check --manifest-path crates/swd-bridge/Cargo.toml
          cargo fmt --check --manifest-path crates/emulator-runner/Cargo.toml
          cargo fmt --check --manifest-path crates/hardware-runner/Cargo.toml

      - name: clippy (thumbv7m build surface)
        run: cargo clippy --target thumbv7m-none-eabi -- -D warnings

      - name: clippy (host-test surface, all targets)
        run: >
          cargo clippy
          --workspace --all-targets
          --target ${{ env.HOST_TARGET }}
          -F store/test-fields
          -- -D warnings

      - name: clippy (swd-bridge, all targets)
        run: >
          cargo clippy
          --manifest-path crates/swd-bridge/Cargo.toml
          --all-targets
          --target ${{ env.HOST_TARGET }}
          -- -D warnings

  # Embedded build for the real target. A bare `cargo build` uses the thumbv7m-none-eabi default from
  # .cargo/config.toml and builds the workspace images (dummy-test, store-test), so it needs the
  # sibling runtime-hal checked out (store/store-test's target-gated FmcFlash dep).
  #
  # The upper flashed-span size gate (against the 62 KiB no-bootloader region) is enforced below,
  # after objcopy (specs/decision-flash-budget.md); the LTO-gutted floor guard is its lower companion.
  build:
    name: Build (thumbv7m-none-eabi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoverboard-firmware
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          path: hoverboard-firmware

      - name: Checkout runtime-hal (sibling, main)
        uses: actions/checkout@v4
        with:
          repository: hoverboardhavoc/runtime-hal
          ref: main
          path: runtime-hal

      # rust-src is load-bearing in THIS job: the release image step is `cargo image`, which is
      # -Z build-std and compiles core from source.
      - name: Install Rust (pinned nightly) + thumbv7m target + rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          targets: thumbv7m-none-eabi
          components: rustfmt, clippy, rust-src

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hoverboard-firmware

      - name: Build (default thumbv7m target)
        run: cargo build

      # The universal shipping image: the release `firmware` ELF (specs/firmware.md, "The binary:
      # downloadable and installable"). One linked image, valid on every part.
      #
      # `cargo image` is the workspace's ONE image command (.cargo/config.toml `[alias]`): release,
      # -p firmware, --target thumbv7m-none-eabi, -Z build-std=core,compiler_builtins. CI runs the
      # SAME alias a developer runs, so the artifact uploaded here is the invocation anyone can
      # reproduce locally, byte for byte. Do not spell the flags out again here: a second copy is a
      # second thing to drift.
      - name: Build release firmware image (cargo image = the build-std shipping build)
        run: cargo image

      # objcopy -O binary gives the flashable .bin. arm-none-eabi-objcopy comes from binutils;
      # the ELF keeps DWARF (profile.release debug = true) for SWD/nm, the .bin is what reaches flash.
      - name: objcopy to .bin
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi
          arm-none-eabi-objcopy -O binary \
            target/thumbv7m-none-eabi/release/firmware \
            target/thumbv7m-none-eabi/release/firmware.bin

      # LTO-gutted-image guard (round-7a): a capacity/assert mismatch can make LTO delete the whole
      # main loop while the image still links (.text 55 KB -> 16.8 KB). Fail the build if the release
      # .text has collapsed below a floor (a healthy image is ~50 KB). arm-none-eabi-size comes from
      # the binutils installed in the objcopy step above. Mirrors tools/flash.sh's flash-time guard.
      - name: Assert release code floor + required symbols (LTO-gutted-image guard)
        run: |
          elf=target/thumbv7m-none-eabi/release/firmware
          # Sum every CODE section, not `.text` alone: the F1x0 zero-wait-flash split
          # (specs/motor-integration.md, "Hot-path flash placement") puts the 16 kHz period ISR and the
          # 250 Hz control path in `.hotcode`, inside the first 32 KiB, so a `.text`-only floor reads a
          # healthy image as gutted. Mirrors tools/flash.sh.
          text=$(arm-none-eabi-size -A "$elf" | awk '$1==".text" || $1==".hotcode" {t+=$2} END{if(t>0) print t}')
          echo "release code (.text + .hotcode) = ${text} B"
          if [ -z "$text" ] || [ "$text" -lt 40000 ]; then
            echo "FAIL: release code (${text}) below the 40000 B floor (LTO-gutted image?)" >&2
            exit 1
          fi
          # Required-symbol half (mirrors tools/flash.sh's integrated PROFILE_REQ_SYMS): the control
          # stack PLUS the six detect fault-path fns. These are #[inline(never)] + host-untestable, so a
          # codegen/LTO change that dropped or inlined-away the bus-fault-safe probe would strip the
          # fleet's only runtime chip-identity path while still linking + passing the .text floor. Fail
          # the build if any is absent.
          syms=$(arm-none-eabi-nm "$elf")
          miss=""
          for s in 'T main$' 'T SysTick$' 'usart1_rx_isr' 'dma_rx_isr' 'B CTRL_OBS$' \
                   'B INJECT_UART_LINE_ERROR$' \
                   '5probe3run' '5probe12probe_family' '5probe15probe_candidate' \
                   '5probe13probe_present' '5probe14measure_counts' '5probe15scratch_present' \
                   '5motor2hw10period_isr' '5motor2hw5MOTOR' '5motor7PERIODS' '5motor9OBS_STATE' \
                   '5motor7OBS_CAL' '3arm2hw4GATE' '3arm2hw5ARMED'; do
            printf '%s\n' "$syms" | grep -qE "$s" || miss="${miss} ${s}"
          done
          if [ -n "$miss" ]; then
            echo "FAIL: required symbol(s) absent from the release image (LTO-gutted?):${miss}" >&2
            exit 1
          fi
          echo "required symbols present (control stack + six detect probe fns + the motor hot path)"
          # Hot-window membership (audit D7): each hot-path symbol must resolve BELOW 0x08008000,
          # the F1x0 zero-wait flash boundary the perf story leans on. Missing = FAIL loudly (a
          # rename/inline must be a conscious list update, per the fsm_step near-miss); above the
          # boundary = a silent 8.8x fetch regression this gate exists to catch. Mirrors
          # tools/flash.sh PROFILE_HOT_SYMS (integrated).
          #
          # `4base5fixed3div` is on the list for BOTH halves. Above the boundary: it is the image's
          # only `Fix` division body, entered 9 times per 250 Hz tick, and left to link order it
          # lands ~0x0800a4xx. Absent: the symbol exists only because of its `#[inline(never)]`;
          # drop that and LLVM re-inlines a ~730 B 128-bit software division at all four call sites,
          # the image grows ~8.6 KB, and nothing else in CI notices.
          hotmiss=""; hotcold=""
          for s in '5motor2hw10period_isr' '12service_loop' 'control_task_cb' 'input_task_cb'                    '9run_shell' '7adc_isr' '15systick_handler' 'systick_tick_cb'                    'route_emits' 'route_handback' '4base5fixed3div'; do
            line=$(printf '%s\n' "$syms" | grep -E "$s" | head -1)
            if [ -z "$line" ]; then hotmiss="${hotmiss} ${s}"; continue; fi
            addr=$(printf '%s' "$line" | awk '{print $1}')
            if [ $((16#$addr)) -ge $((16#08008000)) ]; then hotcold="${hotcold} ${s}@0x${addr}"; fi
          done
          if [ -n "$hotmiss" ]; then
            echo "FAIL: hot-window symbol(s) no longer resolve (inlined/renamed? update the list consciously):${hotmiss}" >&2
            exit 1
          fi
          if [ -n "$hotcold" ]; then
            echo "FAIL: hot-path symbol(s) above the 0x08008000 zero-wait boundary:${hotcold}" >&2
            exit 1
          fi
          echo "hot-window membership OK"

      # UPPER size gate (specs/decision-flash-budget.md, "Mechanical follow-ups", guard 1): fail if the
      # FULL FLASHED SPAN (objcopy .bin size, NOT .text alone -- the .text figure understates the span
      # by ~3.5 KB of .vector_table + .rodata + .data-init the bootloader/SWD also writes) drifts above a
      # ceiling. The hard limit is the 62 KiB (63,488 B) no-bootloader usable region (64 KiB less the
      # 2 KiB store reserve, memory.x); an over-span image fails to LINK there. The floor guard above
      # guards LTO-gutting; this is its upper companion.
      #
      # 2026-07-26, lever adoption: ceiling LOWERED 62,000 -> 60,000, because the image itself dropped.
      # 2026-07-31, slice 5: ceiling RAISED 60,000 -> 61,500, deliberately, at the gate it was set to
      # fire at. The arithmetic, so the next person moving this number sees what it was set against:
      #
      #   hard limit            63,488 B   62 KiB = the 64 KiB part less the 2 KiB store reserve
      #                                    (crates/firmware/memory.x); an over-span image fails to LINK
      #   lever B (vector trim)   -512 B   128-entry, 512-aligned flash table (crates/vectors)
      #   lever A (build-std)   -2,408 B   nightly + `cargo image` + the core/compiler_builtins pins
      #   image at the raise    60,584 B   measured here, both levers in, slice 5's arming plumbing in
      #   IMAGE (2026-08-02)      53,904 B   after the wide-division outlining (-8,616 B, bit-exact)
      #   ceiling                56,000 B  =>  2,096 B of growth before it fires
      #                                        7,488 B still between the ceiling and the hard limit
      #
      # The ceiling is a TRIPWIRE, not a capacity limit, and it is now a RATCHET: when the image
      # shrinks meaningfully the ceiling comes down with it (user-ratified 2026-08-02,
      # specs/decision-flash-budget.md, "Ceiling policy"). Its real job is catching SURPRISES rather
      # than planned growth: twice in one week a slice measured its own change at +808 B and +920 B
      # when ~100 B was expected, and both times the number was caught and the shape reworked. A
      # ceiling left far above the image cannot do that, which is what happened when it drifted
      # 8.9 KB clear after the outlining landed. 56,000 keeps ordinary slices ceremony-free while a
      # runaway still fires with room to fix rather than revert. A cut must ride WITH or AFTER the
      # change that earns it, never before, or CI fails on the spot. The standing reserve (lever C,
      # the ~2,100 B BLE descope) is now spent as a possibility: BLE is the robot's control link.
      - name: Assert release flashed-span ceiling (upper size gate)
        run: |
          span=$(wc -c < target/thumbv7m-none-eabi/release/firmware.bin)
          echo "release flashed span = ${span} B (.bin)"
          ceiling=56000
          if [ "$span" -gt "$ceiling" ]; then
            echo "FAIL: flashed span (${span}) exceeds the ${ceiling} B ceiling (1,988 B below the" >&2
            echo "  63,488 B no-bootloader hard limit, so this is a warning shot, not a link failure)." >&2
            echo "  This gate is meant to fire: re-decide the flash budget deliberately" >&2
            echo "  (specs/decision-flash-budget.md) rather than raising the number to fit. The" >&2
            echo "  standing reserve is lever C, the ~2,100 B BLE descope, so far declined." >&2
            exit 1
          fi
          echo "flashed span within the ${ceiling} B ceiling"

      # Every CI build uploads the .bin and .elf as a workflow artifact, so any commit's image can be
      # downloaded from its Actions run without a local toolchain. One .bin, any part.
      - name: Upload firmware artifacts (.bin + .elf)
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            hoverboard-firmware/target/thumbv7m-none-eabi/release/firmware.bin
            hoverboard-firmware/target/thumbv7m-none-eabi/release/firmware

      # A tagged release additionally attaches them as GitHub Release assets, the stable download.
      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hoverboard-firmware/target/thumbv7m-none-eabi/release/firmware.bin
            hoverboard-firmware/target/thumbv7m-none-eabi/release/firmware

  # Host tests. Run with an explicit host target so they neither inherit the thumbv7m default nor the
  # link.x flag scoped to it in .cargo/config.toml. Even though the HAL is not linked on the host
  # target, cargo still loads its manifest during resolution, so runtime-hal must be present.
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoverboard-firmware
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          path: hoverboard-firmware

      - name: Checkout runtime-hal (sibling, main)
        uses: actions/checkout@v4
        with:
          repository: hoverboardhavoc/runtime-hal
          ref: main
          path: runtime-hal

      - name: Install Rust (pinned nightly) + host target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy, rust-src

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hoverboard-firmware

      # `-F store/test-fields` turns on the store crate's reserved test fields + `run`/`run_var`
      # scenario dispatch (off in a production build), so the store's host tests that exercise them
      # (persist/negative-control) still run. The flag scopes to the `store` member; the rest of the
      # workspace is unaffected.
      - name: Run host tests
        run: cargo test --target ${{ env.HOST_TARGET }} -F store/test-fields

  # crates/swd-bridge is workspace-excluded (a host-only tool: it talks to openocd over TCP), so the
  # workspace host-test job never compiles it. Its unit suite is the ONLY agreement check between the
  # host `HostMailbox` and the firmware `Mailbox` (ring layout, ABI constants, framing), so it runs
  # here via its own manifest on the host target. The tests are pure host unit tests (no openocd, no
  # probe); like every job, the sibling runtime-hal checkout is needed for path-dep resolution.
  swd-bridge-tests:
    name: swd-bridge tests (HostMailbox <-> Mailbox agreement)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoverboard-firmware
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          path: hoverboard-firmware

      - name: Checkout runtime-hal (sibling, main)
        uses: actions/checkout@v4
        with:
          repository: hoverboardhavoc/runtime-hal
          ref: main
          path: runtime-hal

      - name: Install Rust (pinned nightly) + host target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy, rust-src

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hoverboard-firmware

      - name: Run swd-bridge tests
        run: >
          cargo test
          --manifest-path crates/swd-bridge/Cargo.toml
          --target ${{ env.HOST_TARGET }}

  # Tier-2 gate: the real thumbv7m images running under the Unicorn emulator (the same images the bench
  # flashes). emulator-runner is excluded from the workspace (it links Unicorn's cmake-built native lib,
  # which cannot cross-compile to thumbv7m), so it is built/tested via its own manifest on the host
  # target, behind the `unicorn` feature. The tests build the dummy-test AND store-test images first.
  emulator-tests:
    name: Emulator tests (Unicorn, tier 2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoverboard-firmware
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          path: hoverboard-firmware

      - name: Checkout runtime-hal (sibling, main)
        uses: actions/checkout@v4
        with:
          repository: hoverboardhavoc/runtime-hal
          ref: main
          path: runtime-hal

      - name: Install Rust (pinned nightly) + host and thumbv7m targets + clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          targets: x86_64-unknown-linux-gnu, thumbv7m-none-eabi
          components: rustfmt, clippy, rust-src

      - name: Install build tools for Unicorn (cmake + pkg-config)
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config build-essential

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hoverboard-firmware

      - name: Run emulator tests under Unicorn
        run: >
          cargo test
          --manifest-path crates/emulator-runner/Cargo.toml
          --features unicorn
          --target ${{ env.HOST_TARGET }}

      # emulator-runner's clippy lives here, not in the lint job: linting it means compiling its
      # unicorn dep (the cmake-built native lib), and this job already installs cmake + carries the
      # build in its cache. Same --all-targets + -D warnings bar as the lint job.
      - name: clippy (emulator-runner, unicorn, all targets)
        run: >
          cargo clippy
          --manifest-path crates/emulator-runner/Cargo.toml
          --features unicorn
          --all-targets
          --target ${{ env.HOST_TARGET }}
          -- -D warnings

  # The Kotlin mirror's drift gate, and the only job here with no Rust toolchain in it.
  # protocol-kotlin/ is the single Kotlin copy of the wire protocol that crates/link, crates/net,
  # crates/linkctl and crates/store define in Rust, and both in-tree Android apps consume it. Its
  # RustSourceDriftTest PARSES those Rust files and exact-set compares them against the Kotlin, so a
  # firmware edit that outruns the mirror fails here rather than turning up as an unexplained silence
  # on the bench. protocol-kotlin/README.md has the full description.
  #
  # NO PATH FILTER, DELIBERATELY, and this job must not acquire one later. Drift is introduced by
  # editing the RUST: a commit that renumbers an opcode touches crates/ and nothing under
  # protocol-kotlin/. A `paths: protocol-kotlin/**` filter would therefore skip this job on exactly
  # the commit it exists to catch, while still running it on Kotlin-only edits, where the author
  # already has the protocol in front of them. That leaves a job that is green on every commit and
  # catching nothing, which reads as coverage while providing none. This workflow has no path filters
  # at all, so an unfiltered job is both the correct behaviour and free.
  #
  # No sibling runtime-hal checkout and no cargo: the module is pure Kotlin/JVM (kotlin.jvm +
  # java-library; its only dependencies are kotlinx-coroutines and JUnit 5, nothing android.* or
  # androidx.*) and it READS the Rust as text rather than building it. The two in-tree Android apps
  # are deliberately NOT built here: both apply com.android.application, which resolves the Android
  # SDK at CONFIGURATION time, so every task in those builds needs an SDK install this job does not
  # want. Keeping this module SDK-free is what makes the gate cheap enough to run on every commit.
  kotlin-protocol-drift:
    name: Kotlin protocol mirror (firmware drift gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoverboard-firmware/protocol-kotlin
    steps:
      # Same checkout path as the cargo jobs, so this working directory lines up with theirs. The
      # drift test walks up from protocol-kotlin/ looking for crates/linkctl/src/lib.rs, which this
      # single checkout provides; if it ever cannot find it, the test throws with an explanatory
      # message rather than skipping, and the job fails.
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          path: hoverboard-firmware

      # JDK 17 because that is the level the module targets, read out of its build rather than
      # guessed: protocol-kotlin/build.gradle.kts pins sourceCompatibility/targetCompatibility to
      # VERSION_17 and jvmTarget to JVM_17, and both consuming apps compile at 17 as well. The build
      # deliberately declares no jvmToolchain() (its comment says why), so whatever JDK Gradle runs
      # on IS the compiler; running it on 17 makes the compiling JVM and the bytecode target agree.
      - name: Install JDK 17 (the level the module compiles to)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle user home (distribution + dependencies) across runs, and validates the
      # committed gradle-wrapper.jar against Gradle's published checksums. Ours is the official
      # 8.14 wrapper jar (sha256 7d3a4ac4...df296172, checked against
      # services.gradle.org/distributions/gradle-8.14-wrapper.jar.sha256), so that check passes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --rerun and --no-build-cache are the point of this step, not boilerplate. A plain
      # `./gradlew test` reports `Task :test UP-TO-DATE` on any run where Gradle thinks nothing
      # changed and executes NOTHING: green tick, zero tests, which is precisely how this gate was a
      # no-op before. build.gradle.kts does declare crates/**/*.rs as inputs to the test task, and
      # that is the right fix for up-to-date tracking, but it is guarded on the crates directory
      # existing and covers only *.rs beneath crates/, so resting the gate on it means resting it on
      # that declaration staying complete forever. --rerun forces the named task to execute whatever
      # its up-to-date state, --no-build-cache stops a cached result being served instead of a run,
      # and the suite takes about two seconds, so there is nothing worth saving by skipping it.
      - name: Run the protocol tests (forced re-execution, no cache)
        run: ./gradlew test --rerun --no-build-cache --console=plain

      # Belt and braces on the same failure mode from the other side: prove the drift class actually
      # contributed executed cases, rather than the suite passing because it ran nothing. A gate that
      # reports success without running is worse than no gate, so this reads the JUnit XML and fails
      # if the file is absent or the class executed (or skipped) nothing. It runs only when the step
      # above succeeded, which is the case it is here to check.
      - name: Assert the drift gate actually executed
        run: |
          xml=build/test-results/test/TEST-com.hoverboard.protocol.RustSourceDriftTest.xml
          if [ ! -f "$xml" ]; then
            echo "FAIL: no JUnit results for RustSourceDriftTest, so the drift gate did not run." >&2
            exit 1
          fi
          # The `|| true`s keep a non-matching grep from aborting the step under `bash -e` (or
          # pipefail) BEFORE the explanatory checks below get to run. Both paths still fail the job;
          # this only decides whether the log says why.
          suite=$(grep -m1 '<testsuite ' "$xml" || true)
          attr() { { printf '%s\n' "$suite" | grep -o " $1=\"[0-9]*\"" | head -1 | tr -dc '0-9'; } || true; }
          tests=$(attr tests)
          skipped=$(attr skipped)
          echo "RustSourceDriftTest: ${tests} case(s) executed, ${skipped} skipped"
          if [ -z "$tests" ] || [ "$tests" -lt 1 ]; then
            echo "FAIL: RustSourceDriftTest executed no test cases." >&2
            exit 1
          fi
          if [ "$skipped" != "0" ]; then
            echo "FAIL: RustSourceDriftTest skipped ${skipped} case(s); this gate does not skip." >&2
            exit 1
          fi
