# The terminal tool for the hoverboard bridge (specs/hoverboard-bridge.md, "The terminal tool"): BLE via
# btleplug, the ESP's USB console directly or through a TCP relay, L2 framing via `link`, the bridge
# commands via `espsvc`. Host-only, a member of the tools/ workspace.
[package]
name = "hoverboard-cli"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Terminal tool for the hoverboard bridge: commands by noun (board, machine, bridge) for the boards' settings, the machine file, flashing (a firmware bundle or an ELF) and target control over SWD, firmware bundles (pack, info), the bridge's own update and install, and watching and driving the machine, over BLE, the USB console, or the console over TCP (Wi-Fi or a relay)."

[features]
default = ["ble"]
# BLE through btleplug (CoreBluetooth, BlueZ over D-Bus, WinRT). The bench Pi's build turns it off,
# which drops btleplug and its D-Bus dependency; that CLI refuses --device and scan
# (specs/bridge-onboarding.md section 4.2).
ble = ["dep:btleplug", "dep:tokio", "dep:futures"]

[dependencies]
link = { path = "../../shared/link" }
net = { path = "../../shared/net" }
# The registry's field types and the name table (`specs/cli-config.md` section 3), for `config` and
# the file commands.
store = { path = "../../shared/store", features = ["names"] }
linkctl = { path = "../../shared/linkctl" }
# The boot status record's layout and reason codes, for `status` (`specs/configured-links.md`
# section 5): `board.status` decodes with the firmware's own type.
board = { path = "../../motorcontroller/board" }
espsvc = { path = "../../shared/espsvc" }
embedded-io = "0.6"
# The BLE link and `scan` (the `ble` feature).
btleplug = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"], optional = true }
futures = { version = "0.3", optional = true }
# `build` rewrites an ELF without its debug sections for a bundle (`firmware pack`).
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std", "build"] }
regex = "1"
sha2 = "0.10"
uuid = "1"
# The USB console (--serial), and the port list install-esp chooses from. No libudev: the list
# comes from sysfs on Linux.
serialport = { version = "4", default-features = false }
# install-esp (specs/bridge-onboarding.md section 3.3): the flasher and the serial connection, with
# Espressif's flasher stub, and none of espflash's own command line.
espflash = { version = "~4.6", default-features = false, features = ["serialport"] }
# `drive` sends its stop frames on Ctrl-C.
ctrlc = "3"
# A board's store as a JSON file (`board dump`, `apply`, `replace`, `diff`, `board fields --json`), in the order
# a file gives its keys and the name table gives its fields.
serde_json = { version = "1", features = ["preserve_order"] }
# The firmware bundle (specs/firmware-bundle.md): a zip of the image ELFs and a manifest, deflated
# (section 3), so the `deflate` backend; the image crate's Cargo.toml table is read with toml.
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# The flash sizes the bridge flashes (`SUPPORTED_KIB`), so a bundle match the bridge would refuse
# is refused before anything is streamed (specs/firmware-bundle.md section 3.3).
hoverboard-bridge-core = { path = "../../bridge/core" }

[dev-dependencies]
# The bridge side, with the simulated board, for the client-against-service test.
hoverboard-bridge-core = { path = "../../bridge/core", features = ["sim"] }
swd-mailbox = { path = "../../shared/swd-mailbox" }
# Builds the ELF fixtures for the image-check tests.
object = { version = "0.36", default-features = false, features = ["write", "elf", "std"] }
