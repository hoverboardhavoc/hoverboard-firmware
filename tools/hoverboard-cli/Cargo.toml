# The terminal tool for the ESP32 board tool (specs/esp-tool.md, "The terminal tool"): BLE via
# btleplug, the ESP's USB console directly or through a TCP relay, L2 framing via `link`, the ESP
# commands via `espsvc`. Host-only, its own workspace (as crates/swd-bridge is excluded from the main
# one).
[workspace]
resolver = "2"

[package]
name = "hoverboard-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Terminal tool for the ESP32 board tool: scan, info, id, flash, update-esp, clear-protection, target control, memory access, and watching and driving the board over BLE, the USB console, or the console over TCP (Wi-Fi or a relay)."

[dependencies]
link = { path = "../../crates/link" }
net = { path = "../../crates/net" }
linkctl = { path = "../../crates/linkctl" }
espsvc = { path = "../../crates/espsvc" }
embedded-io = "0.6"
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
regex = "1"
sha2 = "0.10"
uuid = "1"
# The USB console (--serial). No libudev: only opening a named device is used.
serialport = { version = "4", default-features = false }
# `drive` sends its stop frames on Ctrl-C.
ctrlc = "3"

[dev-dependencies]
# The ESP side, with the simulated board, for the client-against-service test.
esp-tool-core = { path = "../../apps/esp-tool/core", features = ["sim"] }
swd-mailbox = { path = "../../crates/swd-mailbox" }
# Builds the ELF fixtures for the image-check tests.
object = { version = "0.36", default-features = false, features = ["write", "elf", "std"] }
