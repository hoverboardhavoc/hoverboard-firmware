[package]
name = "emulator-runner"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "Runs a dummy firmware image under the Unicorn CPU+memory emulator at the GD32 addresses and asserts the result. The tier-2 CI gate. Host-only (links Unicorn's native lib, which cannot cross-compile to the chip)."

# Host-only: a member of the tools/ workspace, built on a host target, never thumbv7m. It depends
# on test-shared by path for the shared contract.
[dependencies]
test-shared = { path = "../../motorcontroller/test-shared" }
object = { version = "0.36", default-features = false, features = ["read", "std"] }
unicorn-engine = { version = "2", optional = true }
# The store crate serves two roles here: the LIB reads the store region's placement rule from its one
# owner (store::geometry), and the store-scenario tests build crafted region images with the store's
# OWN codec (record::encode), byte-identical to what the firmware writes. The host build of `store` is
# base-only (its runtime-hal/FmcFlash dep is target-gated), so this pulls in no HAL. `test-fields`
# exposes the scenario ids + reserved test fields the store scenarios reference.
store = { path = "../../shared/store", features = ["test-fields"] }

[dev-dependencies]
# The hoverboard bridge's RAM loader test (tests/bridge_loader.rs) drives the real loader bytes with
# the bridge's own driver (`hoverboard_bridge_core::loader`) over a memory port onto this emulator.
hoverboard-bridge-core = { path = "../../bridge/core" }

[features]
# The Unicorn executor links a cmake-built native lib. It is behind a feature so the crate (and its
# integration tests) only pull it in when the emulator is actually exercised:
#   cargo test --manifest-path crates/emulator-runner/Cargo.toml --features unicorn --target <host>
unicorn = ["dep:unicorn-engine"]

[[test]]
name = "dummy_images"
required-features = ["unicorn"]

[[test]]
name = "store_scenarios"
required-features = ["unicorn"]

[[test]]
name = "bridge_loader"
required-features = ["unicorn"]
