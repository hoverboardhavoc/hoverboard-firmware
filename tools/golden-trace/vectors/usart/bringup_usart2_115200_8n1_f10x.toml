# Mode: final_state. The vendor's config helpers clear then set each field (two writes per field);
# the HAL writes each field in one read-modify-write. The end state configures the hardware:
#   BAUD = 0x00000139 (115200 on the 36 MHz APB1)    +0x08
#   CTL0 = 0x0000200C (UEN bit 13 | TEN bit 3 | REN bit 2)    +0x0C
#   CTL1 = 0x00000000 (one stop bit)    +0x10
description = """
USART2 (ST's USART3, F10x only, on APB1 at 0x4000_4800) brought up at 115200 8N1 on the GD32F10x
register model (STAT 0x00, DATA 0x04, BAUD 0x08, CTL0 0x0C with UEN at bit 13), no transfer. It
shares USART1's 36 MHz APB1 clock, so the end state is USART1's at the +0x400 base. The family table
seeds RCU_CFG0 with the running 72 MHz tree, so the vendor's usart_baudrate_set reads APB1 = 36 MHz
through rcu_clock_freq_get without SystemInit. Both give BAUD = 0x139.

Vendor: usart_disable; usart_baudrate_set(115200); word length 8, one stop bit, no parity; transmit
        and receive on; usart_enable.
HAL: Usart::bring_up(&chip, &REFERENCE_72M_IRC8M, &UsartConfig { Usart2, 115200, 8N1, by 16 }).
"""
family = "gd32f10x"
mode = "final_state"

[vendor]
body = '''
    usart_disable(USART2);
    usart_baudrate_set(USART2, 115200U);
    usart_word_length_set(USART2, USART_WL_8BIT);
    usart_stop_bit_set(USART2, USART_STB_1BIT);
    usart_parity_config(USART2, USART_PM_NONE);
    usart_transmit_config(USART2, USART_TRANSMIT_ENABLE);
    usart_receive_config(USART2, USART_RECEIVE_ENABLE);
    usart_enable(USART2);
'''

[hal]
pending = "the USART driver"
