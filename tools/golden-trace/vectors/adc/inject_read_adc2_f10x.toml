# Mode: with_polling over ADC2. IDATA0 (0x3C) and IDATA1 (0x40) read two right-aligned DC-link
# counts, 0x07A5 and 0x07AC (placeholders near the stock's bench zeros, 1,957 and 1,964, not a
# silicon capture). No STAT read: the period ISR reads the ranks without a wait, paced by ADC0's
# end-of-conversion flag.
description = """
The period ISR's read of ADC2's two DC-link ranks on the GD32F10x (optional-protections.md
sections 3.2 and 6.5): IDATA0 and IDATA1, with no wait for ADC2's own flag.

Vendor: adc_inserted_data_read(ADC2, INSERTED_CHANNEL_0); (INSERTED_CHANNEL_1).
HAL: chip.adc_instance(Adc2), read_injected_data(0); read_injected_data(1).
"""
family = "gd32f10x"
# ADC2 exists on the GD32F103RC alone; the C8 build refuses it (MissingBase).
chips = ["gd32f103rc"]
mode = "with_polling"
assert_only = ["<ADC2_BASE>"]

[read_responses]
"<ADC2_BASE>+0x3C" = 0x0000_07A5
"<ADC2_BASE>+0x40" = 0x0000_07AC

[vendor]
body = '''
    (void)adc_inserted_data_read(ADC2, ADC_INSERTED_CHANNEL_0);
    (void)adc_inserted_data_read(ADC2, ADC_INSERTED_CHANNEL_1);
'''

[hal]
body = '''
    use hal::{Chip, PeriphLabel};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        let adc = chip.adc_instance(PeriphLabel::Adc2).unwrap();
        adc.read_injected_data(0);
        adc.read_injected_data(1);
    }
'''
