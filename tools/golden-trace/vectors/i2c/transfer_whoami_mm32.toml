# Mode: with_polling, narrowed with assert_only to TAR, DR and ENR: the target address, the data and
# read commands, the received byte, and the enable and abort handshake, in order. The bring-up's
# register values are compared by bringup_i2c1_400k_mm32.
#
# SR (0x70) reads 0x0000000E on every read (TFNF | TFE | RFNE): the transmit FIFO drained and a
# received byte waiting, so each poll is satisfied on its first read. RAWISR (0x34) reads
# 0x00000200 (STOP_DET). DR (0x10) reads 0x002E, the WHO_AM_I the bench IMU answers
# (specs/bench-work/mm32/README.md). The flags are the ones the vendor body polls, not a silicon
# capture.
#
# LibSamples' sequence: the target address written with I2C1 disabled (I2C_Cmd(DISABLE), TAR,
# I2C_Cmd(ENABLE)); the register pointer a DR write and a TFE poll; the read DR = CMD (a read
# command), an RFNE poll and a DR read; LibSamples' "STOP" (I2C_GenerateSTOP) a transfer ABORT:
# ENR |= ABORT, a poll until it clears, a read of the TX_ABRT clear register; then a STOP_DET poll.
#
# Outside the assertion, and why: the HAL waits for the master to be idle (SR.MST_ACTIV) before it
# sets TAR, and clears a stale abort and STOP_DET (reads of 0x54 and 0x60) after it, at the start of
# an acquisition, where the sample assumes an idle block and never clears STOP_DET (so after its
# first transfer its STOP_DET wait passes at once). The SR polls of the write and the read and the
# STOP_DET wait after the abort are the vendor's.
description = """
The IMU's WHO_AM_I read on the MM32SPIN05: write the register pointer 0x75 to address 0x69 (the
master board's MPU-6050 clone), read one byte, end the transfer.

Vendor: the bring-up of bringup_i2c1_400k_mm32, then the target address set with the block
        disabled (I2C_Cmd / I2C_Send7bitAddress / I2C_Cmd), I2C_SendData(0x75), wait TFE,
        I2C_ReadCmd, wait RFNE, I2C_ReceiveData, I2C_GenerateSTOP, wait STOP_DET, the order of
        LibSamples' I2C_EEPROM_Polling sample.
HAL: I2c::new(...) as bringup_i2c1_400k_mm32, then write_read(0x69, &[0x75], &mut [0; 1]).
"""
family = "mm32spin05"
mode = "with_polling"
assert_only = [
    "<I2C1_BASE>+0x04",
    "<I2C1_BASE>+0x10",
    "<I2C1_BASE>+0x6C",
]

# The running 72 MHz tree, not reset: I2C_Init derives its SCL counts from RCC_GetPCLK1Freq, which
# reads RCC_CR (bit 20, the HSI's 72 MHz output) and RCC_CFGR (SWS = HSI, HPRE / 1, PPRE1 / 1). That
# is the tree clock/tree_72m_hsi_mm32 ends in: PCLK1 = 72 MHz (see that vector for why APB1 is / 1).
[reset_overrides]
"<RCC_BASE>+0x00" = 0x0010_0003
"<RCC_BASE>+0x04" = 0x0000_000A

[read_responses]
"<I2C1_BASE>+0x70" = 0x0000_000E
"<I2C1_BASE>+0x34" = 0x0000_0200
"<I2C1_BASE>+0x10" = 0x0000_002E

[vendor]
body = '''
    I2C_InitTypeDef s;
    I2C_StructInit(&s);
    s.Mode       = I2C_CR_MASTER;
    s.OwnAddress = 0;
    s.Speed      = I2C_CR_FAST;
    s.ClockSpeed = 400000;
    I2C_Init(I2C1, &s);
    I2C_Cmd(I2C1, ENABLE);

    I2C_Cmd(I2C1, DISABLE);
    I2C_Send7bitAddress(I2C1, 0x69U << 1, I2C_Direction_Transmitter);
    I2C_Cmd(I2C1, ENABLE);

    I2C_SendData(I2C1, 0x75U);
    while(I2C_GetFlagStatus(I2C1, I2C_STATUS_FLAG_TFE) == RESET){}
    I2C_ReadCmd(I2C1);
    while(I2C_GetFlagStatus(I2C1, I2C_STATUS_FLAG_RFNE) == RESET){}
    (void)I2C_ReceiveData(I2C1);
    I2C_GenerateSTOP(I2C1, ENABLE);
    while(I2C_GetITStatus(I2C1, I2C_IT_STOP_DET) == RESET){}
'''

[hal]
body = '''
    use hal::{Chip, ClockConfig, I2c, I2cMode, PeriphLabel, PinAf};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        let (scl, sda) = (
            PinAf { port: 3, pin: 1, af: 1 }, // SCL PD1
            PinAf { port: 3, pin: 0, af: 1 },
        );
        let i2c = I2c::new(
            &chip,
            &ClockConfig::REFERENCE_72M_HSI,
            PeriphLabel::I2c0,
            scl,
            sda,
            I2cMode::fast(400_000, hal::i2c::FastDuty::Two),
        )
        .unwrap();
        let mut who = [0u8; 1];
        // write_read's sequence: a fresh write with no STOP, then a read behind the repeated START.
        i2c.write_bytes(0x69, &[0x75], true, false).unwrap();
        i2c.read_bytes(0x69, &mut who, false).unwrap();
    }
'''
