# Mode: with_polling, narrowed with assert_only to DATA, STAT0 and STAT1: the event handshake. Over
# the whole block the two differ in style only: the vendor's i2c_clock_config ORs CKCFG from reset
# where the HAL writes it (the bring-up's end state is compared by bringup_i2c0_100k_f1x0), and the
# HAL sets CTL0.ACKEN at the start of each transfer phase, a rewrite of the value CTL0 already
# holds here. Every CTL0 write the vendor makes (START, ACK off, STOP, ACK on) the HAL makes too, in
# the same place between the polls.
#
# STAT0 (0x14) reads in order, each poll satisfied on its first read (each read the next value, the
# last one repeats):
#   0x01 SBSEND (START sent)        0x02 ADDSEND (address acknowledged)
#   0x02 the STAT0 read of the ADDSEND clear (a STAT1 read follows)
#   0x80 TBE                        0x04 BTC (register pointer sent)
#   0x01 SBSEND (repeated START)    0x02 ADDSEND    0x02 the clear's STAT0 read
#   0x40 RBNE (byte received)
# STAT1 (0x18) reads 0: the bus is idle at the busy check, and each ADDSEND clear reads it once.
# The flags are the ones the vendor body polls, not a silicon capture.
description = """
The IMU's WHO_AM_I read on the GD32F1x0 I2C0: write the register pointer 0x75 to address 0x68 with
no STOP, a repeated START, read one byte. The one-byte read takes the manual's N = 1 path: ACK off
before the address is acknowledged, STOP after the ADDSEND clear, then wait RBNE and read.

Vendor: the bring-up of bringup_i2c0_100k_f1x0, then the polled handshake with the SPL's
        i2c_flag_get / i2c_start_on_bus / i2c_master_addressing / i2c_flag_clear(ADDSEND) /
        i2c_data_transmit / i2c_ack_config / i2c_stop_on_bus / i2c_data_receive.
HAL: I2c::new(...); write_bytes(0x68, &[0x75], fresh, no stop); read_bytes(0x68, &mut [0; 1], not fresh).
"""
family = "gd32f1x0"
mode = "with_polling"
assert_only = ["<I2C0_BASE>+0x10..0x18"]

[read_responses]
"<I2C0_BASE>+0x14" = [0x01, 0x02, 0x02, 0x80, 0x04, 0x01, 0x02, 0x02, 0x40]
"<I2C0_BASE>+0x18" = 0x00

[vendor]
body = '''
    i2c_clock_config(I2C0, 100000U, I2C_DTCY_2);
    i2c_mode_addr_config(I2C0, I2C_I2CMODE_ENABLE, I2C_ADDFORMAT_7BITS, 0x24U);
    i2c_enable(I2C0);
    i2c_ack_config(I2C0, I2C_ACK_ENABLE);

    /* write the register pointer, no STOP */
    while(i2c_flag_get(I2C0, I2C_FLAG_I2CBSY)){}
    i2c_start_on_bus(I2C0);
    while(!i2c_flag_get(I2C0, I2C_FLAG_SBSEND)){}
    i2c_master_addressing(I2C0, 0x68U << 1, I2C_TRANSMITTER);
    while(!i2c_flag_get(I2C0, I2C_FLAG_ADDSEND)){}
    i2c_flag_clear(I2C0, I2C_FLAG_ADDSEND);
    while(!i2c_flag_get(I2C0, I2C_FLAG_TBE)){}
    i2c_data_transmit(I2C0, 0x75U);
    while(!i2c_flag_get(I2C0, I2C_FLAG_BTC)){}

    /* repeated START, read one byte */
    i2c_start_on_bus(I2C0);
    while(!i2c_flag_get(I2C0, I2C_FLAG_SBSEND)){}
    i2c_master_addressing(I2C0, 0x68U << 1, I2C_RECEIVER);
    i2c_ack_config(I2C0, I2C_ACK_DISABLE);
    while(!i2c_flag_get(I2C0, I2C_FLAG_ADDSEND)){}
    i2c_flag_clear(I2C0, I2C_FLAG_ADDSEND);
    i2c_stop_on_bus(I2C0);
    while(!i2c_flag_get(I2C0, I2C_FLAG_RBNE)){}
    (void)i2c_data_receive(I2C0);
    i2c_ack_config(I2C0, I2C_ACK_ENABLE);
'''

[hal]
body = '''
    use hal::{Chip, ClockConfig, I2c, I2cMode, PeriphLabel, PinAf};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        let (scl, sda) = (
            PinAf { port: 1, pin: 6, af: 1 }, // SCL PB6
            PinAf { port: 1, pin: 7, af: 1 },
        );
        let i2c = I2c::new(
            &chip,
            &ClockConfig::REFERENCE_72M_IRC8M,
            PeriphLabel::I2c0,
            scl,
            sda,
            I2cMode::standard(100_000),
        )
        .unwrap();
        let mut who = [0u8; 1];
        // write_read's sequence: a fresh write with no STOP, then a read behind a repeated START.
        i2c.write_bytes(0x68, &[0x75], true, false).unwrap();
        i2c.read_bytes(0x68, &mut who, false).unwrap();
    }
'''
