# Mode: register_writes. Two read-modify-writes in the same order on both sides:
#   W4 AHBENR  = 0x00020014 (GPIOA, bit 17, over the seeded SRAM and FLITF enables)
#   W4 APB1ENR = 0x00020000 (UART2, bit 17)
description = """
The clock enables for UART2 on PA2/PA3 on the MM32SPIN05: GPIOA on AHBENR bit 17, UART2 on APB1ENR
bit 17. The port first, then the UART.

Vendor: RCC_AHBPeriphClockCmd(RCC_AHBENR_GPIOA, ENABLE); RCC_APB1PeriphClockCmd(RCC_APB1ENR_UART2, ENABLE).
HAL: clock::enable_gpio_port(Gpioa); clock::enable_usart(Usart1) (the HAL's label for UART2, at
0x4000_4400, the GD32 USART1's address).
"""
family = "mm32spin05"
mode = "register_writes"

[vendor]
body = '''
    RCC_AHBPeriphClockCmd(RCC_AHBENR_GPIOA, ENABLE);
    RCC_APB1PeriphClockCmd(RCC_APB1ENR_UART2, ENABLE);
'''

[hal]
body = '''
    use hal::{clock, Chip, PeriphLabel};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        let rcu = chip.rcu_base().unwrap();
        clock::enable_gpio_port(rcu, chip.clock(), PeriphLabel::Gpioa).unwrap();
        clock::enable_usart(rcu, chip.clock(), PeriphLabel::Usart1).unwrap();
    }
'''
