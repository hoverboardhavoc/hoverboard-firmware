# Mode: register_writes. Two read-modify-writes in the same order on both sides:
#   W4 AHBENR  = 0x00100014 (GPIOD, bit 20, over the seeded SRAM and FLITF enables)
#   W4 APB1ENR = 0x00200000 (I2C1, bit 21)
description = """
The clock enables for the IMU's I2C link on the MM32SPIN05 master (I2C1 on PD1 SCL / PD0 SDA,
specs/bench-work/mm32/README.md): the GPIO ports on AHBENR (GPIOD = bit 20), I2C1 on APB1ENR
(bit 21). The port first, then the bus.

Vendor: RCC_AHBPeriphClockCmd(RCC_AHBENR_GPIOD, ENABLE); RCC_APB1PeriphClockCmd(RCC_APB1ENR_I2C1, ENABLE).
HAL: clock::enable_gpio_port(Gpiod); clock::enable_i2c(I2c0) (the HAL's label for I2C1, at 0x4000_5400).
"""
family = "mm32spin05"
mode = "register_writes"

[vendor]
body = '''
    RCC_AHBPeriphClockCmd(RCC_AHBENR_GPIOD, ENABLE);
    RCC_APB1PeriphClockCmd(RCC_APB1ENR_I2C1, ENABLE);
'''

[hal]
body = '''
    use hal::{clock, Chip, PeriphLabel};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        let rcu = chip.rcu_base().unwrap();
        clock::enable_gpio_port(rcu, chip.clock(), PeriphLabel::Gpiod).unwrap();
        clock::enable_i2c(rcu, chip.clock(), PeriphLabel::I2c0).unwrap();
    }
'''
