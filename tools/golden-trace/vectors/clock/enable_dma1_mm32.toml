# Mode: register_writes. One read-modify-write of AHBENR:
#   W4 AHBENR = 0x00000015 (DMA1, bit 0, over the seeded SRAM and FLITF enables)
# The HAL's DMA clock enable is crate-internal (`clock::enable_dma`, reached through the serial DMA
# bring-ups `DmaTx::new` and `RingBufferedRx::new`), so this vector has no HAL body of its own; the
# enable is compared inside the serial vectors once they exist.
description = """
The DMA clock enable on the MM32SPIN05: DMA1 on AHBENR bit 0 (RCC_AHBENR_DMA1).

Vendor: RCC_AHBPeriphClockCmd(RCC_AHBENR_DMA1, ENABLE).
"""
family = "mm32spin05"
mode = "register_writes"

[vendor]
body = '''
    RCC_AHBPeriphClockCmd(RCC_AHBENR_DMA1, ENABLE);
'''

[hal]
pending = "a public DMA clock enable (hal's clock::enable_dma is crate-internal)"
