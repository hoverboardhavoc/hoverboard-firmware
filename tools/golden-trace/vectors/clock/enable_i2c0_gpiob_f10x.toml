# Mode: register_writes. Two read-modify-writes in the same order on both sides, to two registers:
#   W4 APB2EN = 0x00000008 (GPIOB, bit 3)
#   W4 APB1EN = 0x00200000 (I2C0, bit 21)
description = """
The clock enables for the IMU's I2C link (I2C0 on PB6/PB7) on the GD32F10x: the F10x puts the GPIO
port enables on APB2EN (GPIOB = bit 3) and I2C0 on APB1EN (bit 21). The port first, then the bus.

Vendor: rcu_periph_clock_enable(RCU_GPIOB); rcu_periph_clock_enable(RCU_I2C0).
HAL: chip.pin(port B) (the port clock alone); clock::enable_i2c(I2c0).
"""
family = "gd32f10x"
mode = "register_writes"

[vendor]
body = '''
    rcu_periph_clock_enable(RCU_GPIOB);
    rcu_periph_clock_enable(RCU_I2C0);
'''

[hal]
body = '''
    use hal::{clock, Chip, PeriphLabel, PinId};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        let rcu = chip.rcu_base().unwrap();
        let _ = chip.pin(PinId { port: 1, pin: 0 });
        clock::enable_i2c(rcu, chip.clock(), PeriphLabel::I2c0).unwrap();
    }
'''
