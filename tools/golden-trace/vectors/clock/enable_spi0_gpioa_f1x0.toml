# Mode: register_writes. Two read-modify-writes in the same order, to two registers:
#   W4 AHBEN  = 0x00020014 (GPIOA, bit 17, over the reset SRAM and FMC enables)
#   W4 APB2EN = 0x00001000 (SPI0, bit 12)
description = """
The clock enables for SPI0 and its port (SCK/MISO/MOSI on PA5/PA6/PA7) on the GD32F1x0: GPIOA is
AHBEN bit 17 and SPI0 APB2EN bit 12.

Vendor: rcu_periph_clock_enable(RCU_GPIOA); rcu_periph_clock_enable(RCU_SPI0).
HAL: clock::enable_gpio_port(Gpioa); clock::enable_spi(Spi0).
"""
family = "gd32f1x0"
mode = "register_writes"

[vendor]
body = '''
    rcu_periph_clock_enable(RCU_GPIOA);
    rcu_periph_clock_enable(RCU_SPI0);
'''

[hal]
body = '''
    use hal::{clock, Chip, PeriphLabel};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        let rcu = chip.rcu_base().unwrap();
        clock::enable_gpio_port(rcu, chip.clock(), PeriphLabel::Gpioa).unwrap();
        clock::enable_spi(rcu, chip.clock(), PeriphLabel::Spi0).unwrap();
    }
'''
