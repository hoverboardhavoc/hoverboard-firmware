# Mode: final_state. The register traffic of pwm_bringup_timer0_f10x at TIMER7's base, so the end
# state is that vector's:
#   CTL0   = 0x000001C0, PSC = 0, CAR = 0x000008CA (2250), CREP = 0, SWEVG = UPG
#   CHCTL0 = 0x00006868, CHCTL1 = 0x00000068, CHCTL2 = 0x00000DDD, CTL1 = 0x00003F00
#   CH0CV = CH1CV = CH2CV = 0, CCHP = 0x00000C1C (MOE off)
description = """
TIMER7's complementary PWM bring-up on the GD32F103RC (the 12-FET's second bridge): the TIMER0
vector pwm_bringup_timer0_f10x at TIMER7's base. Centre-aligned at 2250 counts (about 16 kHz at
72 MHz), three channel pairs with the low side inverted and a safe high idle, dead time 0x1C, break
disabled, MOE left off. TIMER7 is TIMER0's register model at 0x4001_3400 (gd32f10x_timer.h); only
the high-density part carries it, and it takes no trigger channel (TIMER0 triggers the ADC).

Vendor: timer_init(CENTER_UP, CKDIV_DIV2, PSC 0, CAR 2250, CREP 0); for CH0-CH2
        timer_channel_output_config (EN | NEN, polarity high, N polarity low, idle high), PWM0,
        the compare shadow, pulse 0; timer_auto_reload_shadow_enable; timer_break_config (dead time
        0x1C, ROS, IOS, break off). No timer_primary_output_config.
HAL: PwmTimer::configure(&chip, &PwmConfig { Timer7, the three gate pairs with the low side
     inverted and idle high, period 2250, prescaler 0, dead time 0x1C, break off,
     centre-aligned, ARSE, clock division /2 }).
"""
family = "gd32f10x"
# TIMER7 exists on the GD32F103RC alone (its descriptor); the C8 build refuses it (MissingBase).
chips = ["gd32f103rc"]
mode = "final_state"

[vendor]
body = '''
    timer_parameter_struct tp;
    tp.prescaler         = 0U;
    tp.alignedmode       = TIMER_COUNTER_CENTER_UP;
    tp.counterdirection  = TIMER_COUNTER_UP;
    tp.clockdivision     = TIMER_CKDIV_DIV2;
    tp.period            = 2250U;
    tp.repetitioncounter = 0U;
    timer_init(TIMER7, &tp);

    timer_oc_parameter_struct oc;
    oc.outputstate  = TIMER_CCX_ENABLE;
    oc.outputnstate = TIMER_CCXN_ENABLE;
    oc.ocpolarity   = TIMER_OC_POLARITY_HIGH;
    oc.ocnpolarity  = TIMER_OCN_POLARITY_LOW;   /* inverted low side */
    oc.ocidlestate  = TIMER_OC_IDLE_STATE_HIGH; /* safe idle */
    oc.ocnidlestate = TIMER_OCN_IDLE_STATE_HIGH;
    for(uint16_t ch = TIMER_CH_0; ch <= TIMER_CH_2; ch++){
        timer_channel_output_config(TIMER7, ch, &oc);
        timer_channel_output_mode_config(TIMER7, ch, TIMER_OC_MODE_PWM0);
        timer_channel_output_shadow_config(TIMER7, ch, TIMER_OC_SHADOW_ENABLE);
        timer_channel_output_pulse_value_config(TIMER7, ch, 0U);
    }
    timer_auto_reload_shadow_enable(TIMER7);

    timer_break_parameter_struct bp;
    bp.runoffstate     = TIMER_ROS_STATE_ENABLE;
    bp.ideloffstate    = TIMER_IOS_STATE_ENABLE;
    bp.deadtime        = 0x1CU;
    bp.breakpolarity   = TIMER_BREAK_POLARITY_LOW;
    bp.outputautostate = TIMER_OUTAUTO_DISABLE;
    bp.protectmode     = TIMER_CCHP_PROT_OFF;
    bp.breakstate      = TIMER_BREAK_DISABLE;
    timer_break_config(TIMER7, &bp);
    /* no timer_primary_output_config: MOE stays off */
'''

[hal]
body = '''
    use hal::config::{
        BreakConfig, ClockDiv, OcMode, PwmAlign, PwmChannelConfig, PwmConfig, TrgoSource,
    };
    use hal::{Chip, PeriphLabel, PwmTimer};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        // Low side inverted (the vendor's OCN polarity low), both outputs idling high.
        let pair = || PwmChannelConfig {
            polarity: true,
            idle_high: true,
            idle_high_n: true,
        };
        let cfg = PwmConfig {
            timer: PeriphLabel::Timer7,
            channels: [pair(), pair(), pair()],
            period: 2250,
            prescaler: 0,
            dead_time: 0x1C,
            brk: BreakConfig {
                enabled: false,
                level: false,
            },
            trigger_compare: 2249,
            align: PwmAlign::Center2,
            arse: true,
            trigger_oc_mode: OcMode::Pwm0,
            trigger_ch_enable: false,
            crep: 0,
            ckdiv: ClockDiv::Div2,
            trgo_src: TrgoSource::Update,
        };
        let _timer = PwmTimer::configure(&chip, &cfg).unwrap();
    }
'''
