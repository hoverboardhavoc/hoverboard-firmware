# Mode: final_state over the whole TIM1 block. LibSamples' TIM_TimeBaseInit and TIM_OCxInit are
# MODIFY_REG sequences per field; the HAL writes each register in its own count and order. The end
# state (the GD32 TIMER0 vectors' configuration, in STM32 register names):
#   CR1   = 0x000001C0 (centre-aligned mode 2 (0x40) | ARPE (0x80) | CKD /2 (0x100))
#   PSC = 0, ARR = 0x000008CA (2250), RCR = 0, EGR = UG (the update that loads them)
#   CCMR1 = 0x00006868, CCMR2 = 0x00000068 (CH1-CH3 PWM mode 1 with preload)
#   CCER  = 0x00000DDD (per pair: CCxE | CCxNE | CCxNP, the inverted low side)
#   CR2   = 0x00003F00 (every output idles high)
#   CCR1 = CCR2 = CCR3 = 0 (zero duty)
#   BDTR  = 0x00000C1C (dead time 0x1C | OSSI | OSSR; break off, MOE off)
description = """
TIM1's complementary PWM bring-up on the MM32SPIN05: centre-aligned at 2250 counts (about 16 kHz at
72 MHz), three channel pairs with the low side inverted and a safe high idle, dead time 0x1C, break
disabled, MOE left off. CH4 (the ADC trigger) is trgo_trigger_tim1_mm32's. TIM1's registers sit at
the GD32 TIMER0's offsets with the same bit positions (reg_tim.h), which this vector and its HAL
twin check rather than assume (specs/hal.md section 3.1).

Vendor: TIM_TimeBaseInit(CenterAligned2, CKD_DIV2, PSC 0, ARR 2250, RCR 0); TIM_OC1Init..OC3Init
        (PWM1, both outputs on, OC polarity high, OCN polarity low, both idles set, pulse 0) each
        with its preload; TIM_ARRPreloadConfig; TIM_BDTRConfig (dead time 0x1C, OSSR, OSSI, break
        off, AOE off). No TIM_CtrlPWMOutputs.
HAL: PwmTimer::configure(&chip, &PwmConfig { Timer0 (TIM1), the gate pairs PA8-10 / PB13-15 with
     the low side inverted and idle high, period 2250, prescaler 0, dead time 0x1C, break off,
     centre-aligned 2, ARSE, clock division /2 }).
"""
family = "mm32spin05"
mode = "final_state"

[vendor]
body = '''
    TIM_TimeBaseInitTypeDef tb;
    tb.TIM_Prescaler         = 0;
    tb.TIM_CounterMode       = TIM_CounterMode_CenterAligned2;
    tb.TIM_Period            = 2250;
    tb.TIM_ClockDivision     = TIM_CKD_DIV2;
    tb.TIM_RepetitionCounter = 0;
    TIM_TimeBaseInit(TIM1, &tb);

    TIM_OCInitTypeDef oc;
    oc.TIM_OCMode       = TIM_OCMode_PWM1;
    oc.TIM_OutputState  = TIM_OutputState_Enable;
    oc.TIM_OutputNState = TIM_OutputNState_Enable;
    oc.TIM_Pulse        = 0;
    oc.TIM_OCPolarity   = TIM_OCPolarity_High;
    oc.TIM_OCNPolarity  = TIM_OCNPolarity_Low;     /* inverted low side */
    oc.TIM_OCIdleState  = TIM_OCIdleState_Set;     /* safe idle */
    oc.TIM_OCNIdleState = TIM_OCNIdleState_Set;
    TIM_OC1Init(TIM1, &oc);
    TIM_OC1PreloadConfig(TIM1, TIM_OCPreload_Enable);
    TIM_OC2Init(TIM1, &oc);
    TIM_OC2PreloadConfig(TIM1, TIM_OCPreload_Enable);
    TIM_OC3Init(TIM1, &oc);
    TIM_OC3PreloadConfig(TIM1, TIM_OCPreload_Enable);
    TIM_ARRPreloadConfig(TIM1, ENABLE);

    TIM_BDTRInitTypeDef bd;
    bd.TIM_OSSRState       = TIM_OSSRState_Enable;
    bd.TIM_OSSIState       = TIM_OSSIState_Enable;
    bd.TIM_LOCKLevel       = TIM_LOCKLevel_OFF;
    bd.TIM_DeadTime        = 0x1C;
    bd.TIM_Break           = TIM_Break_Disable;
    bd.TIM_BreakPolarity   = TIM_BreakPolarity_Low;
    bd.TIM_AutomaticOutput = TIM_AutomaticOutput_Disable;
    TIM_BDTRConfig(TIM1, &bd);
    /* no TIM_CtrlPWMOutputs: MOE stays off */
'''

[hal]
body = '''
    use hal::config::{
        BreakConfig, ClockDiv, OcMode, PwmAlign, PwmChannelConfig, PwmConfig, TrgoSource,
    };
    use hal::{Chip, PeriphLabel, PwmTimer};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        // Low side inverted (the vendor's OCN polarity low), both outputs idling high.
        let pair = || PwmChannelConfig {
            polarity: true,
            idle_high: true,
            idle_high_n: true,
        };
        let cfg = PwmConfig {
            timer: PeriphLabel::Timer0,
            channels: [pair(), pair(), pair()],
            period: 2250,
            prescaler: 0,
            dead_time: 0x1C,
            brk: BreakConfig {
                enabled: false,
                level: false,
            },
            trigger_compare: 2249,
            align: PwmAlign::Center2,
            arse: true,
            trigger_oc_mode: OcMode::Pwm0,
            trigger_ch_enable: false,
            crep: 0,
            ckdiv: ClockDiv::Div2,
            trgo_src: TrgoSource::Update,
        };
        let _timer = PwmTimer::configure(&chip, &cfg).unwrap();
    }
'''
