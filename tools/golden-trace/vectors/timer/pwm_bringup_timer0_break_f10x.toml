# Mode: final_state, as pwm_bringup_timer0_f10x, with the break input enabled active low. The end
# state differs in CCHP alone:
#   CCHP   = 0x00001C1C (dead time 0x1C | ROS | IOS | BRKEN; BRKP clear = active low; MOE off)
description = """
TIMER0's complementary PWM bring-up on the GD32F10x with its hardware break input enabled, active low
(optional-protections.md section 3.3: the 12-FET's PB12, the stock's CCHP 0x1120 less its lock):
centre-aligned at 2250 counts, three channel pairs with the low side inverted and a safe high idle,
dead time 0x1C, break enabled active low, MOE left off. CH3 (the ADC trigger) is trgo_trigger_timer0_f10x's. The advanced-timer
block is the same on both families.

Vendor: timer_init(CENTER_UP, CKDIV_DIV2, PSC 0, CAR 2250, CREP 0); for CH0-CH2
        timer_channel_output_config (EN | NEN, polarity high, N polarity low, idle high), PWM0,
        the compare shadow, pulse 0; timer_auto_reload_shadow_enable; timer_break_config (dead time
        0x1C, ROS, IOS, break on, polarity low). No timer_primary_output_config.
HAL: PwmTimer::configure(&chip, &PwmConfig { Timer0, the three gate pairs PA8-10 / PB13-15 with the
     low side inverted and idle high, period 2250, prescaler 0, dead time 0x1C, break on and low,
     centre-aligned, ARSE, clock division /2 }).
"""
family = "gd32f10x"
mode = "final_state"

[vendor]
body = '''
    timer_parameter_struct tp;
    tp.prescaler         = 0U;
    tp.alignedmode       = TIMER_COUNTER_CENTER_UP;
    tp.counterdirection  = TIMER_COUNTER_UP;
    tp.clockdivision     = TIMER_CKDIV_DIV2;
    tp.period            = 2250U;
    tp.repetitioncounter = 0U;
    timer_init(TIMER0, &tp);

    timer_oc_parameter_struct oc;
    oc.outputstate  = TIMER_CCX_ENABLE;
    oc.outputnstate = TIMER_CCXN_ENABLE;
    oc.ocpolarity   = TIMER_OC_POLARITY_HIGH;
    oc.ocnpolarity  = TIMER_OCN_POLARITY_LOW;   /* inverted low side */
    oc.ocidlestate  = TIMER_OC_IDLE_STATE_HIGH; /* safe idle */
    oc.ocnidlestate = TIMER_OCN_IDLE_STATE_HIGH;
    for(uint16_t ch = TIMER_CH_0; ch <= TIMER_CH_2; ch++){
        timer_channel_output_config(TIMER0, ch, &oc);
        timer_channel_output_mode_config(TIMER0, ch, TIMER_OC_MODE_PWM0);
        timer_channel_output_shadow_config(TIMER0, ch, TIMER_OC_SHADOW_ENABLE);
        timer_channel_output_pulse_value_config(TIMER0, ch, 0U);
    }
    timer_auto_reload_shadow_enable(TIMER0);

    timer_break_parameter_struct bp;
    bp.runoffstate     = TIMER_ROS_STATE_ENABLE;
    bp.ideloffstate    = TIMER_IOS_STATE_ENABLE;
    bp.deadtime        = 0x1CU;
    bp.breakpolarity   = TIMER_BREAK_POLARITY_LOW;
    bp.outputautostate = TIMER_OUTAUTO_DISABLE;
    bp.protectmode     = TIMER_CCHP_PROT_OFF;
    bp.breakstate      = TIMER_BREAK_ENABLE;
    timer_break_config(TIMER0, &bp);
    /* no timer_primary_output_config: MOE stays off */
'''

[hal]
body = '''
    use hal::config::{
        BreakConfig, ClockDiv, OcMode, PwmAlign, PwmChannelConfig, PwmConfig, TrgoSource,
    };
    use hal::{Chip, PeriphLabel, PwmTimer};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        // Low side inverted (the vendor's OCN polarity low), both outputs idling high.
        let pair = || PwmChannelConfig {
            polarity: true,
            idle_high: true,
            idle_high_n: true,
        };
        let cfg = PwmConfig {
            timer: PeriphLabel::Timer0,
            channels: [pair(), pair(), pair()],
            period: 2250,
            prescaler: 0,
            dead_time: 0x1C,
            brk: BreakConfig {
                enabled: true,
                level: false,
            },
            trigger_compare: 2249,
            align: PwmAlign::Center2,
            arse: true,
            trigger_oc_mode: OcMode::Pwm0,
            trigger_ch_enable: false,
            crep: 0,
            ckdiv: ClockDiv::Div2,
            trgo_src: TrgoSource::Update,
        };
        let _timer = PwmTimer::configure(&chip, &cfg).unwrap();
    }
'''
