# Mode: final_state over the whole TIMER0 block: both sides do the full bring-up (the HAL has no
# path to a PwmTimer without it), then the trigger. The trigger's part of the end state:
#   CHCTL1 = 0x00006868 (CH3 PWM0 | CH3 compare shadow, over CH2's bring-up byte)
#   CH3CV  = 0x000008C9 (2249, just under the top of the count)
#   CTL1   = 0x00003F20 (MMC = update, over the bring-up's idle levels)
# CH3's output enable stays off, so CHCTL2 is the bring-up's.
description = """
TIMER0's ADC trigger on the GD32F1x0: CH3 as an output-compare channel (PWM0, compare shadow, compare
value 2249) whose match is the injected ADC's external trigger, and the TRGO master mode set to the
update event. CH3 drives no pin. This is the timer side of the timer-to-ADC coupling whose ADC side
is adc/inject_bringup_adc0_f1x0.

Vendor: the bring-up of pwm_bringup_timer0_f1x0, then for CH3 PWM0, the compare shadow and pulse
        2249; timer_master_output_trigger_source_select(TIMER_TRI_OUT_SRC_UPDATE).
HAL: PwmTimer::configure(...) as pwm_bringup_timer0_f1x0, then
     configure_trigger(2249, Pwm0, no output, Update).
"""
family = "gd32f1x0"
mode = "final_state"

[vendor]
body = '''
    timer_parameter_struct tp;
    tp.prescaler         = 0U;
    tp.alignedmode       = TIMER_COUNTER_CENTER_UP;
    tp.counterdirection  = TIMER_COUNTER_UP;
    tp.clockdivision     = TIMER_CKDIV_DIV2;
    tp.period            = 2250U;
    tp.repetitioncounter = 0U;
    timer_init(TIMER0, &tp);

    timer_oc_parameter_struct oc;
    oc.outputstate  = TIMER_CCX_ENABLE;
    oc.outputnstate = TIMER_CCXN_ENABLE;
    oc.ocpolarity   = TIMER_OC_POLARITY_HIGH;
    oc.ocnpolarity  = TIMER_OCN_POLARITY_LOW;   /* inverted low side */
    oc.ocidlestate  = TIMER_OC_IDLE_STATE_HIGH; /* safe idle */
    oc.ocnidlestate = TIMER_OCN_IDLE_STATE_HIGH;
    for(uint16_t ch = TIMER_CH_0; ch <= TIMER_CH_2; ch++){
        timer_channel_output_config(TIMER0, ch, &oc);
        timer_channel_output_mode_config(TIMER0, ch, TIMER_OC_MODE_PWM0);
        timer_channel_output_shadow_config(TIMER0, ch, TIMER_OC_SHADOW_ENABLE);
        timer_channel_output_pulse_value_config(TIMER0, ch, 0U);
    }
    timer_auto_reload_shadow_enable(TIMER0);

    timer_break_parameter_struct bp;
    bp.runoffstate     = TIMER_ROS_STATE_ENABLE;
    bp.ideloffstate    = TIMER_IOS_STATE_ENABLE;
    bp.deadtime        = 0x1CU;
    bp.breakpolarity   = TIMER_BREAK_POLARITY_LOW;
    bp.outputautostate = TIMER_OUTAUTO_DISABLE;
    bp.protectmode     = TIMER_CCHP_PROT_OFF;
    bp.breakstate      = TIMER_BREAK_DISABLE;
    timer_break_config(TIMER0, &bp);
    /* no timer_primary_output_config: MOE stays off */

    timer_channel_output_mode_config(TIMER0, TIMER_CH_3, TIMER_OC_MODE_PWM0);
    timer_channel_output_shadow_config(TIMER0, TIMER_CH_3, TIMER_OC_SHADOW_ENABLE);
    timer_channel_output_pulse_value_config(TIMER0, TIMER_CH_3, 2249U);
    timer_master_output_trigger_source_select(TIMER0, TIMER_TRI_OUT_SRC_UPDATE);
'''

[hal]
body = '''
    use hal::config::{
        BreakConfig, ClockDiv, OcMode, PwmAlign, PwmChannelConfig, PwmConfig, TrgoSource,
    };
    use hal::{Chip, PeriphLabel, PwmTimer};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        // Low side inverted (the vendor's OCN polarity low), both outputs idling high.
        let pair = |high, low| PwmChannelConfig {
            high,
            low,
            polarity: true,
            idle_high: true,
            idle_high_n: true,
        };
        let cfg = PwmConfig {
            timer: PeriphLabel::Timer0,
            channels: [pair(0x08, 0x1D), pair(0x09, 0x1E), pair(0x0A, 0x1F)],
            period: 2250,
            prescaler: 0,
            dead_time: 0x1C,
            brk: BreakConfig {
                enabled: false,
                level: false,
            },
            trigger_compare: 2249,
            align: PwmAlign::Center2,
            arse: true,
            trigger_oc_mode: OcMode::Pwm0,
            trigger_ch_enable: false,
            crep: 0,
            ckdiv: ClockDiv::Div2,
            trgo_src: TrgoSource::Update,
        };
        let timer = PwmTimer::configure(&chip, &cfg).unwrap();
        timer.configure_trigger(2249, OcMode::Pwm0, false, TrgoSource::Update);
    }
'''
