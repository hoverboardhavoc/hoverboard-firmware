# Mode: final_state, narrowed with assert_only to CHCTL2, the register set_channel_outputs writes.
# After the bring-up each pair holds EN | NEN | NP = 0xD; disabling CH1 clears its EN and NEN and keeps
# the NP polarity bit. End state for [CH0 on, CH1 off, CH2 on]:
#   CHCTL2 = 0x00000D8D
description = """
The per-channel output gating of TIMER0 on the GD32F10x: after the bring-up, the PWM handle's
set_channel_outputs([true, false, true]) turns off CH1's main and complementary outputs and leaves
CH0 and CH2 on. This is the handle's channel gate, not the MOE arm gate.

Vendor: timer_channel_output_config(CH0..CH2, the bring-up's output parameters); then
        timer_channel_output_state_config(CH1, CCX_DISABLE) and
        timer_channel_complementary_output_state_config(CH1, CCXN_DISABLE).
HAL: PwmTimer::configure(...) as pwm_bringup_timer0_f10x, then
     handle().set_channel_outputs([true, false, true]).
"""
family = "gd32f10x"
mode = "final_state"
assert_only = ["<TIMER0_BASE>+0x20"]

[vendor]
body = '''
    timer_oc_parameter_struct oc;
    oc.outputstate  = TIMER_CCX_ENABLE;
    oc.outputnstate = TIMER_CCXN_ENABLE;
    oc.ocpolarity   = TIMER_OC_POLARITY_HIGH;
    oc.ocnpolarity  = TIMER_OCN_POLARITY_LOW;
    oc.ocidlestate  = TIMER_OC_IDLE_STATE_HIGH;
    oc.ocnidlestate = TIMER_OCN_IDLE_STATE_HIGH;
    timer_channel_output_config(TIMER0, TIMER_CH_0, &oc);
    timer_channel_output_config(TIMER0, TIMER_CH_1, &oc);
    timer_channel_output_config(TIMER0, TIMER_CH_2, &oc);
    timer_channel_output_state_config(TIMER0, TIMER_CH_1, TIMER_CCX_DISABLE);
    timer_channel_complementary_output_state_config(TIMER0, TIMER_CH_1, TIMER_CCXN_DISABLE);
'''

[hal]
body = '''
    use hal::config::{
        BreakConfig, ClockDiv, OcMode, PwmAlign, PwmChannelConfig, PwmConfig, TrgoSource,
    };
    use hal::{Chip, PeriphLabel, PwmTimer};

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        // Low side inverted (the vendor's OCN polarity low), both outputs idling high.
        let pair = || PwmChannelConfig {
            polarity: true,
            idle_high: true,
            idle_high_n: true,
        };
        let cfg = PwmConfig {
            timer: PeriphLabel::Timer0,
            channels: [pair(), pair(), pair()],
            period: 2250,
            prescaler: 0,
            dead_time: 0x1C,
            brk: BreakConfig {
                enabled: false,
                level: false,
            },
            trigger_compare: 2249,
            align: PwmAlign::Center2,
            arse: true,
            trigger_oc_mode: OcMode::Pwm0,
            trigger_ch_enable: false,
            crep: 0,
            ckdiv: ClockDiv::Div2,
            trgo_src: TrgoSource::Update,
        };
        let timer = PwmTimer::configure(&chip, &cfg).unwrap();
        timer.handle().set_channel_outputs([true, false, true]);
    }
'''
