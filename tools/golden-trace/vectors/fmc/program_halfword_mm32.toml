# Mode: register_writes over the FLASH block (the writes in order, not the reads: LibSamples'
# FLASH_GetStatus reads SR up to three times per poll, once per flag it tests: BSY, PGERR,
# WRPRTERR). The key pair, CR |= PG, the half-word store into flash (not traced: main flash is
# outside the hooked windows), the busy poll, CR = 0, the flags cleared, CR |= LOCK.
#
# SR (0x0C) reads 0x00000020 (EOP, BSY clear) on every read. The store page is seeded erased
# (0xFFFF at the target and its successor) so the HAL's erased-and-not-closed check passes.
description = """
One half-word programmed on the MM32SPIN05, 0xA55A at the store's first page 0x0800_7800: unlock,
PG, the store, wait not busy, clear PG and the flags, lock. On silicon the store must come from the
core (a debugger's half-word write at 2 mod 4 stores 0, specs/bench-work/mm32/README.md); here it is
at 0 mod 4 either way.

Vendor: FLASH_Unlock(); FLASH_ProgramHalfWord(0x08007800, 0xA55A); FLASH_Lock().
HAL: Fmc::new(&chip).program(0x0800_7800, &[0x5A, 0xA5]).
"""
family = "mm32spin05"
mode = "register_writes"
assert_only = ["<FLASH_BASE>"]

[read_responses]
"<FLASH_BASE>+0x0C" = 0x0000_0020

[reset_overrides]
"<STORE_PAGE0>+0x00" = 0xFFFF_FFFF
"<STORE_PAGE0>+0x04" = 0xFFFF_FFFF

[vendor]
body = '''
    FLASH_Unlock();
    (void)FLASH_ProgramHalfWord(0x08007800U, 0xA55AU);
    FLASH_Lock();
'''

[hal]
body = '''
    use hal::fmc::Fmc;
    use hal::Chip;

    pub fn body() {
        // SAFETY: the vector owns the whole chip.
        let chip = unsafe { Chip::steal() };
        Fmc::new(&chip).program(0x0800_7800, &[0x5A, 0xA5]).unwrap();
    }
'''
