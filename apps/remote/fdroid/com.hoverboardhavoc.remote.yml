# The F-Droid metadata for the app, as a template. The version lives in one place,
# apps/remote/app/build.gradle.kts (versionName and versionCode, as literals: F-Droid reads them
# from that file). tools/fdroid-build.sh fills the @...@ fields from it and from the commit it
# builds; the copy in fdroiddata carries the same fields filled for the released tag.
Categories:
  - Connectivity
  - Remote Controller
License: GPL-3.0-or-later
AuthorName: hoverboardhavoc
WebSite: https://hoverboardhavoc.com
SourceCode: https://github.com/hoverboardhavoc/hoverboard-firmware
IssueTracker: https://github.com/hoverboardhavoc/hoverboard-firmware/issues

AutoName: Hoverboard Remote

RepoType: git
Repo: https://github.com/hoverboardhavoc/hoverboard-firmware.git

Builds:
  - versionName: '@VERSION_NAME@'
    versionCode: @VERSION_CODE@
    commit: '@COMMIT@'
    subdir: apps/remote/app
    gradle:
      - yes
    scandelete:
      - bridge/bootloader
      - bridge/loader

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]
CurrentVersion: '@VERSION_NAME@'
CurrentVersionCode: @VERSION_CODE@
