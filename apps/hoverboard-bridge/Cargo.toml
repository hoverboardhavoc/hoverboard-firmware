[workspace]
resolver = "2"
members = ["core"]

[package]
name = "hoverboard-bridge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Hoverboard bridge firmware for the ESP32-C3 (specs/hoverboard-bridge.md): BLE peripheral, USB and Wi-Fi console, SWD engine, board flashing, the mailbox bridge and its own slot updates."

[[bin]]
name = "hoverboard-bridge"
path = "src/main.rs"
test = false
bench = false

[features]
# One line of text on the USB console at each boot step (README.md, "A silent boot"), through
# esp-println's logger at info level, with esp-radio's own info lines among them. For reading a
# boot on the bench only: the console otherwise carries the L2 stream and nothing else.
boot-log = ["dep:log", "esp-println/log-04", "esp-println/critical-section"]

[dependencies]
log = { version = "0.4", optional = true }
esp-hal = { version = "1.0.0", features = ["esp32c3", "unstable"] }
esp-radio = { version = "0.17.0", features = ["esp32c3", "ble", "wifi", "coex", "log-04", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["esp32c3", "embassy", "esp-alloc", "esp-radio", "log-04"] }
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c3"] }
# The ESP's own flash, for its app slots (src/platform.rs) and its keys (src/keys.rs).
esp-storage = { version = "0.8.1", features = ["esp32c3"] }
embedded-storage = "0.3"
# The panic backtrace's output, on the USB-Serial-JTAG; nothing else prints (src/usb.rs).
esp-println = { version = "0.16.0", default-features = false, features = ["esp32c3", "jtag-serial"] }
embassy-executor = "0.9"
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-futures = "0.1"
embedded-io-async = "0.6"
# The Wi-Fi station's IP stack, the TCP console and the mDNS responder (src/wifi.rs).
embassy-net = { version = "0.8", features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "tcp", "udp", "multicast"] }
edge-mdns = { version = "0.7", default-features = false, features = ["io"] }
edge-nal = "0.6"
# gdbstub's `alloc` (the GDB session's packet buffer, core/src/gdb.rs) turns on `managed/alloc`,
# and smoltcp 0.12 then needs its own `alloc` for the `ManagedSlice::Owned` arms it matches on.
# Nothing here builds an owned socket set; the line only keeps the two features in step.
smoltcp = { version = "0.12", default-features = false, features = ["alloc"] }
edge-nal-embassy = { version = "0.8", default-features = false, features = ["proto-ipv4", "medium-ethernet", "udp", "multicast"] }
trouble-host = { git = "https://github.com/embassy-rs/trouble", rev = "94e15ffe139bc992c1a8b4c34c1fd6a6359356ef", features = ["default-packet-pool-mtu-255"] }
static_cell = "2.1"
# The GATT characteristic value type trouble-host implements (its heapless is 0.9; the shared
# crates use 0.8).
heapless09 = { package = "heapless", version = "0.9" }
# The hardware-free logic: SWD engine, board operations, flash, mailbox, BLE routing, commands.
hoverboard-bridge-core = { path = "core" }
# The command payloads (`WifiState`, `Status`, `SLOT_NONE`).
espsvc = { path = "../../crates/espsvc" }
# The bridge's own keys (src/keys.rs): the boards' store over the `keys` partition.
store = { path = "../../crates/store" }
base = { path = "../../crates/base" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[patch.crates-io]
esp-alloc = { git = "https://github.com/lulf/esp-hal.git", rev = "49ba429e34266bcac867b968e0a55b433d5a7c37" }
esp-backtrace = { git = "https://github.com/lulf/esp-hal.git", rev = "49ba429e34266bcac867b968e0a55b433d5a7c37" }
esp-bootloader-esp-idf = { git = "https://github.com/lulf/esp-hal.git", rev = "49ba429e34266bcac867b968e0a55b433d5a7c37" }
esp-hal = { git = "https://github.com/lulf/esp-hal.git", rev = "49ba429e34266bcac867b968e0a55b433d5a7c37" }
esp-println = { git = "https://github.com/lulf/esp-hal.git", rev = "49ba429e34266bcac867b968e0a55b433d5a7c37" }
esp-storage = { git = "https://github.com/lulf/esp-hal.git", rev = "49ba429e34266bcac867b968e0a55b433d5a7c37" }
esp-radio = { git = "https://github.com/lulf/esp-hal.git", rev = "49ba429e34266bcac867b968e0a55b433d5a7c37" }
esp-rtos = { git = "https://github.com/lulf/esp-hal.git", rev = "49ba429e34266bcac867b968e0a55b433d5a7c37" }
