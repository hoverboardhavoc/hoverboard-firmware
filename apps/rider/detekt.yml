# Detekt overrides for a Jetpack Compose codebase.
# Builds upon detekt's bundled defaults (see app/build.gradle.kts: buildUponDefaultConfig);
# only the rules that conflict with idiomatic Compose are relaxed here.

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # Composables and test builders legitimately take many small UI/state params.
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
    constructorThreshold: 8

style:
  MagicNumber:
    # Color literals, dp/sp sizes and similar UI constants are clearer inline.
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    # Early-return guard clauses (length/version checks, link-state guards) read clearly.
    max: 4
  LoopWithTooManyJumpStatements:
    # A filter loop written as `if (notInteresting) continue` plus one exit is two jumps by this
    # rule's count and one idea to a reader, and the BLE service/characteristic walks are all that
    # shape. Two is allowed; three still reads as control flow worth untangling, and the complexity
    # and nesting rules cover the case this one is a proxy for.
    maxJumpCount: 2

performance:
  SpreadOperator:
    # Compose's `stringResource(id, vararg formatArgs)` can only be reached by spreading, so a
    # composable that formats a caption from a small argument list has no other spelling. The rule
    # still applies everywhere else, where the array copy can be in a hot path.
    ignoreAnnotated: ['Composable']

Compose:
  MultipleEmitters:
    active: false
