# The bridge end of the SWD RAM mailbox (specs/swd-mailbox.md), as a no_std crate: the ring logic and
# the attach handshake over a `MemAp` seam, moved out of `crates/swd-bridge` so the hoverboard bridge
# (apps/hoverboard-bridge, specs/hoverboard-bridge.md "Mailbox port") runs the same code the host tools do. The host
# crate keeps its OpenOCD backend and re-exports this one.
[package]
name = "swd-bridge-core"
version = "0.1.0"
license.workspace = true
edition = "2021"
description = "The bridge end of the SWD RAM mailbox: SPSC ring producer/consumer and the epoch attach handshake over a MemAp trait, with a typed error and an injected delay. no_std."

[dependencies]
# The mailbox ABI (layout offsets, MAGIC/VERSION, RING_CAP, the registry fingerprint) and the
# `placed_whole` write decision both ends of the ring share.
swd-mailbox = { path = "../swd-mailbox" }
embedded-io = "0.6"

[dev-dependencies]
# The firmware end runs the L2 stream framer over the rings in the round-trip test.
link = { path = "../link" }
